    { text: 'Build it passing the secret file, and check the history is clean', hint: 'docker build -f Dockerfile.safe --secret id=piptoken,src=token.txt -t safe:1 .\ndocker history --no-trunc safe:1', check: function (ev) { return E(ev, 'history', function (e) { return !e.leak && /safe/.test(e.name); }); } }
  ],
  wrap: '<p>Same result, no trace of the token. Notice token.txt is also in .dockerignore so it never enters the context. Runtime secrets belong in your orchestrator (Docker/Compose secrets at <code>/run/secrets</code>, Kubernetes Secrets, a vault), not in ENV baked into the image.</p>' });

add({ id: '6-6', ch: 6, title: 'Scan before you ship', xp: 160, codex: ['scan'],
  brief: 'Compare base images by how many known vulnerabilities they carry.',
  learn: '<p>Every package in every layer is attack surface. <b>Docker Scout</b> (also Trivy, Grype) builds an SBOM (software bill of materials) and matches it against CVE databases. Fewer packages = fewer CVEs.</p><p>The counts here are simulated samples; the pattern is real.</p>',
  setup: function (w) { },
  goals: [
    { text: 'Scan the full python:3.12 image', hint: 'docker scout cves python:3.12', check: function (ev) { return E(ev, 'scout', function (e) { return e.name === 'python:3.12'; }); } },
    { text: 'Scan python:3.12-slim', hint: 'docker scout cves python:3.12-slim', check: function (ev) { return E(ev, 'scout', function (e) { return /slim/.test(e.name); }); } },
    { text: 'Scan a minimal base (alpine or distroless)', hint: 'docker scout cves gcr.io/distroless/static-debian12', check: function (ev) { return E(ev, 'scout', function (e) { return e.total < 5; }); } }
  ],
  wrap: '<p>Smaller bases, regular rebuilds (to pick up patches) and scanning in CI are the three habits that keep CVE counts down. Pin base images by digest when you need reproducible builds, and let a bot (Renovate/Dependabot) bump them.</p>' });

add({ id: '6-q', ch: 6, title: 'Checkpoint: Security', type: 'quiz', xp: 0,
  questions: [
    { q: 'Mounting /var/run/docker.sock into a container gives it…', o: ['Read-only stats', 'Full control of the Docker daemon, effectively host root', 'Access to other containers\' logs only', 'Nothing special'], a: 1, why: 'The daemon runs as root and can mount the host filesystem.' },
    { q: 'Where does a build ARG used in RUN end up?', o: ['Nowhere', 'In the image history, in plain text', 'Encrypted in the manifest', 'Only in the build cache'], a: 1, why: 'Use RUN --mount=type=secret for secrets.' },
    { q: 'Best way to let a non-root web server bind port 80?', o: ['--privileged', '--cap-drop ALL --cap-add NET_BIND_SERVICE', 'Run as root', '--network host'], a: 1, why: 'Grant only the one capability needed.' },
    { q: '--read-only plus which flag gives the app a writable scratch dir?', o: ['--tmpfs /tmp', '--privileged', '-p 80', '--init'], a: 0, why: 'tmpfs is a RAM-backed writable mount.' },
    { q: 'Which base image usually has the fewest CVEs?', o: ['python:3.12 (full Debian)', 'ubuntu', 'distroless/static', 'node:22'], a: 2, why: 'Fewer packages, smaller attack surface.' }
  ] });

/* ===== Chapter 7 ===== */
add({ id: '7-1', ch: 7, title: 'Multi-stage diet', xp: 220, badge: 'diet', codex: ['multistage'], files: ['Dockerfile.single', 'Dockerfile.go', 'cmd/server/main.go'],
  brief: 'A Go API ships as a 1 GB image containing the whole compiler. Compare it with a multi-stage build.',
  learn: '<p>A <b>multi-stage</b> Dockerfile has several <code>FROM</code>s. Early stages are workshops with compilers and caches; the final stage starts from a tiny base and copies only the result with <code>COPY --from=build</code>.</p><p>Read <code>Dockerfile.go</code>: three stages (build, test, final). The final stage is <b>distroless</b>: no shell, no package manager.</p>',
  setup: function (w) { w.setFiles(GO_FILES); w.preload(['golang:1.23', 'gcr.io/distroless/static-debian12']); },
  goals: [
    { text: 'Build the single-stage version as api:fat', hint: 'docker build -f Dockerfile.single -t api:fat .', check: function (ev) { return E(ev, 'build', function (e) { return e.tags.indexOf('api:fat') >= 0; }); } },
    { text: 'Build the multi-stage version as api:slim', hint: 'docker build -f Dockerfile.go -t api:slim .', check: function (ev) { return E(ev, 'build', function (e) { return e.tags.indexOf('api:slim') >= 0 && e.stages > 1; }); } },
    { text: 'Compare sizes', hint: 'docker images api', check: function (ev) { return E(ev, 'images'); } },
    { text: 'Run api:slim on port 8080 and call it', hint: 'docker run -d --name api -p 8080:8080 api:slim\ncurl localhost:8080', check: function (ev) { return E(ev, 'curl', function (e) { return /service/.test(e.body || ''); }); } },
    { text: 'Try to open a shell in it', hint: 'docker exec -it api sh', check: function (ev) { return E(ev, 'exec', function (e) { return !e.ok; }); } }
  ],
  wrap: '<p>~1 GB → ~10 MB, and no shell for an attacker to use. Also notice the build log: the <b>test</b> stage was <i>skipped</i> because the final stage does not depend on it. For debugging distroless containers, use <code>docker debug</code> or a <code>:debug</code> image variant.</p>' });

add({ id: '7-2', ch: 7, title: 'Build only what you need', xp: 160, codex: ['multistage', 'buildkit'], files: ['Dockerfile.go'],
  brief: 'CI wants to run the test stage on every commit, without shipping it.',
  learn: '<p>BuildKit builds the <b>dependency graph</b> of stages and only builds what the target needs, in parallel where possible. <code>--target NAME</code> stops at a given stage. That is how one Dockerfile serves dev, test and prod.</p>',
  setup: function (w) { w.setFiles(GO_FILES); w.preload(['golang:1.23', 'gcr.io/distroless/static-debian12']); },
  goals: [
    { text: 'Build the default target and spot the skipped stage', hint: 'docker build -f Dockerfile.go -t api:prod .', check: function (ev) { return E(ev, 'build', function (e) { return e.skipped.indexOf('test') >= 0; }); } },
    { text: 'Build only up to the test stage', hint: 'docker build -f Dockerfile.go --target test -t api:test .', check: function (ev) { return E(ev, 'build', function (e) { return e.target === 'test'; }); } }
  ],
  wrap: '<p>The second build reused every cached step of the build stage and only ran <code>go test</code>. In CI: <code>docker build --target test .</code> first, then the real build, which hits the same cache.</p>' });

add({ id: '7-3', ch: 7, title: 'Cache mounts', xp: 190, codex: ['buildkit'], files: ['Dockerfile.cache', 'requirements.txt'],
  brief: 'Changing requirements.txt forces a full 38 s pip install every time. Keep pip\'s download cache between builds.',
  learn: '<p>When <code>requirements.txt</code> changes, the layer cache must miss. But a <b>cache mount</b> (<code>RUN --mount=type=cache,target=/root/.cache/pip</code>) gives that step a persistent folder that survives between builds and is <i>never</i> part of the image. pip then reuses already-downloaded wheels.</p>',
  setup: function (w) { projPython(w, { good: true, ignore: true }); w.preload(['python:3.12-slim']); w.setFiles({ 'Dockerfile.cache': '# syntax=docker/dockerfile:1\nFROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN --mount=type=cache,target=/root/.cache/pip \\\n    pip install -r requirements.txt\nCOPY . .\nCMD ["gunicorn", "--bind", "0.0.0.0:8000", "app:app"]\n' }); },
  goals: [
    { text: 'Build Dockerfile.cache once (fills the cache mount)', hint: 'docker build -f Dockerfile.cache -t app:cache .', check: function (ev) { return E(ev, 'build', function (e) { return e.file === 'Dockerfile.cache'; }); } },
    { text: 'Change the dependencies', hint: 'sim edit requirements.txt', check: function (ev) { return E(ev, 'host-file', function (e) { return e.files.indexOf('requirements.txt') >= 0; }); } },
    { text: 'Rebuild: pip install reruns but finishes in seconds', hint: 'docker build -f Dockerfile.cache -t app:cache .', check: function (ev) { return E(ev, 'build', function (e) { return e.steps.some(function (s) { return s.op === 'RUN' && !s.cached && s.warm && s.secs < 10; }); }); } }
  ],
  wrap: '<p>The layer cache answers "can I skip this step?"; a cache mount answers "if I must rerun it, can it be fast?". Use them for pip, npm (<code>/root/.npm</code>), go (<code>/go/pkg/mod</code>, <code>/root/.cache/go-build</code>), apt and cargo.</p>' });

add({ id: '7-4', ch: 7, title: 'Many CPUs, one tag', xp: 220, badge: 'poly', codex: ['multiarch'],
  brief: 'The company is moving to ARM servers (like AWS Graviton or Apple Silicon). The old image will not start there. Ship one tag that works on both.',
  learn: '<p>Container images contain compiled binaries for one CPU architecture. An amd64 binary cannot run on arm64 without emulation: you get <code>exec format error</code>.</p><p><code>docker buildx build --platform linux/amd64,linux/arm64 --push</code> builds both and pushes a <b>manifest list</b>: one tag, one entry per platform. <code>docker pull</code> picks the right one.</p>',
  setup: function (w) { projPython(w, { good: true, ignore: true }); w.preload(['python:3.12-slim', 'quest/legacy:1.0']); },
  goals: [
    { text: 'Switch the host to an ARM CPU', hint: 'sim host-arch arm64', check: function (ev) { return E(ev, 'arch', function (e) { return e.arch === 'arm64'; }); } },
    { text: 'Run the amd64-only quest/legacy:1.0 and read why it dies', hint: 'docker run -d --name legacy quest/legacy:1.0\ndocker logs legacy', check: function (ev, w, m) { if (E(ev, 'exec-format')) m.ef = true; return m.ef && E(ev, 'logs'); } },
    { text: 'Log in, then build and push a multi-arch image', hint: 'docker login\ndocker buildx build --platform linux/amd64,linux/arm64 -t you/myapp:2.0 --push .', check: function (ev) { return E(ev, 'build', function (e) { return e.platforms.length > 1 && e.pushed; }); } },
    { text: 'Inspect the manifest list', hint: 'docker manifest inspect you/myapp:2.0', check: function (ev) { return E(ev, 'manifest', function (e) { return e.platforms.length > 1; }); } },
    { text: 'Run it on the ARM host', hint: 'docker run -d --name app2 -p 8000:8000 you/myapp:2.0', check: function (ev, w) { return w.arch === 'arm64' && running(w, function (c) { var i = w.images[c.image]; return i && (i.cfg.platforms || []).indexOf('linux/arm64') >= 0 && /myapp/.test(c.imageRef); }).length > 0; } }
  ],
  wrap: '<p>Multi-arch builds use QEMU emulation or native builder nodes. Base images must also be multi-arch (official images are). Pure-Go or Python images are easy; native extensions need care.</p>' });

add({ id: '7-5', ch: 7, title: 'Tags move, digests do not', xp: 190, codex: ['registry'],
  brief: 'Production and staging both "use nginx:latest" but behave differently. Find out how that is possible and pin an exact version.',
  learn: '<p>A <b>tag</b> is a mutable pointer: maintainers can move <code>latest</code> to a new build any time. A <b>digest</b> (<code>@sha256:…</code>) is the content hash of the manifest. It can never point to different bytes.</p><p>Pinning by digest gives byte-for-byte reproducible deployments.</p>',
  setup: function (w, m) { w.preload(['nginx']); var r = w.registry['docker.io/library/nginx']; m.orig = r.tags.latest; },
  goals: [
    { text: 'Show local images with their digests', hint: 'docker images --digests', check: function (ev) { return E(ev, 'images'); } },
    { text: 'Simulate the maintainers publishing a new latest', hint: 'sim upstream-release nginx', check: function (ev) { return E(ev, 'upstream'); } },
    { text: 'Pull nginx:latest again: a different image arrives', hint: 'docker pull nginx', check: function (ev, w, m) { return E(ev, 'pull', function (e) { return e.ref === 'nginx:latest' && e.digest !== m.orig; }); } },
    { text: 'Pull the ORIGINAL image by its digest', hint: function (w, m) { return 'docker pull nginx@' + m.orig; }, check: function (ev, w, m) { return E(ev, 'pull', function (e) { return e.byDigest && e.digest === m.orig; }); } }
  ],
  wrap: '<p>Production pulled before the release; staging after. Same tag, different bytes. In deployment manifests use <code>nginx:1.27@sha256:…</code>: readable and immutable.</p>' });

add({ id: '7-q', ch: 7, title: 'Checkpoint: Fleet Architect', type: 'quiz', xp: 0,
  questions: [
    { q: 'In a multi-stage build, what ends up in the final image?', o: ['Every stage', 'Only the target stage\'s layers', 'All COPY --from sources', 'The build cache'], a: 1, why: 'Earlier stages are discarded except what you COPY --from them.' },
    { q: 'What does --target test do?', o: ['Runs tests after the build', 'Builds up to and including the stage named test', 'Pushes to a test registry', 'Skips the test stage'], a: 1, why: 'It stops at that stage; unrelated stages are skipped.' },
    { q: 'A cache mount\'s contents…', o: ['Are baked into the image', 'Persist between builds but never enter the image', 'Are deleted after each step', 'Are pushed to the registry'], a: 1, why: 'They speed up reruns without bloating layers.' },
    { q: '"exec format error" usually means…', o: ['Wrong file permissions', 'The binary is for a different CPU architecture', 'The Dockerfile has a syntax error', 'Out of memory'], a: 1, why: 'amd64 vs arm64 mismatch without emulation.' },
    { q: 'Which reference is immutable?', o: ['nginx:latest', 'nginx:1.27', 'nginx@sha256:…', 'nginx:stable'], a: 2, why: 'Digests are content hashes; tags are pointers.' }
  ] });

/* ===== Chapter 8 ===== */
add({ id: '8-1', ch: 8, title: 'It is just a process', xp: 220, badge: 'kernel', codex: ['namespaces', 'internals'],
  brief: 'There is no VM. Prove it by finding a container\'s process from the host and reading its namespace IDs.',
  learn: '<p>A container is a normal Linux process started by runc with new <b>namespaces</b> and a <b>cgroup</b>. From the host it has an ordinary PID. <code>/proc/PID/ns/</code> lists its namespace IDs; when they differ from the host\'s, the process is isolated.</p>',
  setup: function (w) { w.preload(['nginx:alpine']); w.silent('docker run -d --name web nginx:alpine'); },
  goals: [
    { text: 'Get the host PID of "web"', hint: "docker inspect -f '{{.State.Pid}}' web", check: function (ev) { return E(ev, 'inspect', function (e) { return /Pid/.test(e.fmt || ''); }); } },
    { text: 'Find it in the host\'s process list', hint: 'ps aux | grep nginx', check: function (ev) { return E(ev, 'host-ps'); } },
    { text: 'List its namespaces from the host', hint: function (w) { var c = w.findC('web'); return 'sudo ls -l /proc/' + (c ? c.hostPid : '<pid>') + '/ns'; }, check: function (ev) { return E(ev, 'host-ns', function (e) { return !!e.container; }); } },
    { text: 'Compare: host PIDs (docker top) vs inside (ps)', hint: 'docker top web\ndocker exec web ps', check: function (ev, w, m) { if (E(ev, 'top')) m.top = true; if (E(ev, 'ps-inside')) m.ps = true; return m.top && m.ps; } }
  ],
  wrap: '<p>Same process, two PIDs: e.g. 24892 on the host, 1 inside. Namespace IDs differ for pid, net, mnt, uts and ipc but match for user (unless userns-remap or rootless mode is on). This is why containers start in milliseconds, and why a kernel exploit affects every container on the host.</p>' });

add({ id: '8-2', ch: 8, title: 'Layers on disk', xp: 200, codex: ['internals', 'cow'],
  brief: 'Find a file a container wrote by looking directly at Docker\'s storage directory on the host.',
  learn: '<p>overlay2 stacks directories: <b>LowerDir</b> (image layers, read-only), <b>UpperDir</b> (the container\'s writable layer), merged into <b>MergedDir</b>, which becomes the container\'s <code>/</code>. They live under <code>/var/lib/docker/overlay2</code>.</p>',
  setup: function (w) { w.preload(['nginx:alpine']); w.silent('docker run -d --name web nginx:alpine'); },
  goals: [
    { text: 'Write /tmp/proof.txt inside "web"', hint: 'docker exec web sh -c "echo hello-from-inside > /tmp/proof.txt"', check: function (ev) { return E(ev, 'write', function (e) { return e.where === 'upper'; }); } },
    { text: 'Ask Docker where the overlay directories are', hint: "docker inspect -f '{{json .GraphDriver.Data}}' web", check: function (ev) { return E(ev, 'inspect', function (e) { return /GraphDriver/.test(e.fmt || ''); }); } },
    { text: 'List the UpperDir from the host', hint: function (w) { var c = w.findC('web'); return 'sudo ls ' + (c ? w.inspectC(c).GraphDriver.Data.UpperDir + '/tmp' : '<UpperDir>'); }, check: function (ev) { return E(ev, 'host-overlay'); } }
  ],
  wrap: '<p>The "isolated" file is a plain file on the host disk. That is why <code>docker diff</code> is cheap, why the writable layer is slow for heavy I/O (use volumes), and why anyone with root on the host can read every container\'s files.</p>' });

add({ id: '8-3', ch: 8, title: 'Swarm: a fleet of hosts', xp: 220, codex: ['orchestration'],
  brief: 'One host is a single point of failure. Turn this engine into a cluster manager and run a replicated service.',
  learn: '<p>An <b>orchestrator</b> keeps <i>desired state</i> ("3 replicas of nginx") and continuously reconciles reality toward it. Docker has one built in: <b>Swarm mode</b>. Kubernetes uses the same idea at larger scale.</p><p><code>docker swarm init</code> makes this node a manager. The simulator adds two workers for you.</p>',
  setup: function (w) { w.preload(['nginx']); },
  goals: [
    { text: 'Initialise a swarm', hint: 'docker swarm init', check: function (ev) { return E(ev, 'swarm-init'); } },
    { text: 'List the nodes', hint: 'docker node ls', check: function (ev) { return E(ev, 'node-ls'); } },
    { text: 'Create service "web": 3 replicas of nginx on port 8080', hint: 'docker service create --name web --replicas 3 -p 8080:80 nginx', check: function (ev) { return E(ev, 'svc-create', function (e) { return e.replicas >= 3; }); } },
    { text: 'See where the tasks landed', hint: 'docker service ps web', check: function (ev) { return E(ev, 'svc-ps'); } },
    { text: 'Call it a few times through the routing mesh', hint: 'curl localhost:8080\ncurl localhost:8080', check: function (ev, w, m) { ev.forEach(function (e) { if (e.t === 'curl' && e.task) { m.tasks = m.tasks || {}; m.tasks[e.task] = 1; } }); return m.tasks && Object.keys(m.tasks).length >= 2; } }
  ],
  wrap: '<p>Each request landed on a different task: the <b>routing mesh</b> opens port 8080 on every node and load-balances over the ingress overlay network. Switch the engine room to the Cluster view to see tasks per node.</p>' });

add({ id: '8-4', ch: 8, title: 'Survive a node failure', xp: 240, badge: 'fleet', codex: ['orchestration'],
  brief: 'At 3 a.m. worker-1 loses power. Watch the cluster heal itself, then scale and roll out a new version with zero downtime.',
  learn: '<p>When a node stops sending heartbeats, the manager marks it <b>Down</b> and reschedules its tasks elsewhere. <b>Scaling</b> changes desired replicas. A <b>rolling update</b> replaces tasks one at a time so the service never goes fully offline.</p>',
  setup: function (w) { w.preload(['nginx']); w.silent('docker swarm init'); w.silent('docker service create --name web --replicas 3 -p 8080:80 nginx'); },
  goals: [
    { text: 'Kill worker-1', hint: 'sim kill-node worker-1', check: function (ev) { return E(ev, 'node-down', function (e) { return e.moved > 0; }); } },
    { text: 'Check that 3 replicas are still running', hint: 'docker service ps web', check: function (ev) { return E(ev, 'svc-ps'); } },
    { text: 'Scale web to 6 replicas', hint: 'docker service scale web=6', check: function (ev) { return E(ev, 'svc-scale', function (e) { return e.replicas >= 6; }); } },
    { text: 'Roll out nginx:1.27-alpine', hint: 'docker service update --image nginx:1.27-alpine web', check: function (ev) { return E(ev, 'svc-update'); } }
  ],
  wrap: '<p>You never touched a container directly: you changed desired state and the orchestrator did the work. Kubernetes maps 1:1: service → Deployment + Service, task → Pod, node failure → Pods rescheduled, rolling update → <code>kubectl set image</code>. Check the Codex entry "Orchestration".</p>' });

add({ id: '8-q', ch: 8, title: 'Final exam', type: 'quiz', xp: 0, badge: 'graduate', final: true,
  questions: [
    { q: 'Containers share what with the host?', o: ['Nothing', 'The kernel', 'A hypervisor', 'A guest OS'], a: 1, why: 'That is the core difference from VMs.' },
    { q: 'Namespaces control ___; cgroups control ___.', o: ['what a process can use; what it can see', 'what a process can see; what it can use', 'networking; storage', 'images; containers'], a: 1, why: 'Visibility vs resources.' },
    { q: 'Which is TRUE about image layers?', o: ['Each container copies them', 'They are read-only and shared by digest', 'They shrink when you rm files later', 'They are mutable'], a: 1, why: 'Immutability + content addressing enables sharing and caching.' },
    { q: 'Fastest fix for a Dockerfile that reinstalls dependencies on every code change?', o: ['Use --no-cache', 'Copy the dependency manifest and install before COPY . .', 'Use a bigger base image', 'Add EXPOSE'], a: 1, why: 'Order from least to most frequently changing.' },
    { q: 'Container B cannot resolve container A by name. First thing to check?', o: ['CPU limit', 'Whether both are on the same user-defined network', 'The image size', 'The restart policy'], a: 1, why: 'Embedded DNS works only on user-defined networks.' },
    { q: 'Your app needs a password at runtime. Best option?', o: ['ENV in the Dockerfile', 'ARG at build time', 'A runtime secret / env var injected by the orchestrator', 'COPY .env into the image'], a: 2, why: 'Never bake secrets into images.' },
    { q: 'A service must survive a whole host dying. You need…', o: ['--restart always', 'An orchestrator with multiple nodes', 'A bigger server', 'A volume'], a: 1, why: 'Restart policies only work on the same host.' },
    { q: 'In Kubernetes terms, a Compose "service" with replicas maps closest to…', o: ['A Pod', 'A Deployment (+ Service)', 'A Node', 'A ConfigMap'], a: 1, why: 'Deployments manage replicated Pods; a Service gives a stable address.' },
    { q: 'Why does --init help?', o: ['Speeds up builds', 'Adds a tiny PID 1 that forwards signals and reaps zombies', 'Initialises volumes', 'Logs in to the registry'], a: 1, why: 'tini as PID 1 fixes signal and zombie issues.' },
    { q: 'Which command shows where an image\'s size comes from, layer by layer?', o: ['docker ps -s', 'docker history', 'docker stats', 'docker logs'], a: 1, why: 'history lists layers with sizes and the instruction that created them.' }
  ] });

/* ---------------- codex ---------------- */
var CODEX = {
  what: { t: 'What Docker is and why it exists', lvl: 'Beginner', h: '<p>Docker packages an app with everything it needs (runtime, libraries, config) into an <b>image</b>, and runs it as an isolated process called a <b>container</b>. The same image runs identically on a laptop, CI and production, ending "works on my machine".</p><p><b>Origins:</b> chroot (1979) → FreeBSD jails (2000) → Solaris Zones (2004) → Linux cgroups and namespaces (2006–08) → LXC (2008). In 2013 Solomon Hykes at dotCloud open-sourced Docker, which made these kernel features easy with a simple file format (Dockerfile), layered images and a public registry. In 2015 the <b>Open Container Initiative</b> standardised image and runtime formats, so Docker images now run on Podman, containerd and every Kubernetes cluster.</p><p>The name and whale logo come from shipping containers: standard boxes that any crane, ship or truck can move without knowing the contents.</p>' },
  arch: { t: 'Architecture: CLI → dockerd → containerd → runc', lvl: 'Beginner', h: '<table><tr><th>Part</th><th>Job</th></tr><tr><td>docker CLI</td><td>Turns commands into REST calls to /var/run/docker.sock</td></tr><tr><td>dockerd</td><td>API, images, builds (BuildKit), networks, volumes</td></tr><tr><td>containerd</td><td>Container lifecycle and image store (also used by Kubernetes)</td></tr><tr><td>containerd-shim</td><td>Parent of each container, so containers survive daemon restarts</td></tr><tr><td>runc</td><td>Creates namespaces + cgroups, execs PID 1, then exits</td></tr></table><p>On macOS/Windows, Docker Desktop runs all of this inside a small Linux VM.</p>' },
  imgvsctr: { t: 'Image vs container', lvl: 'Beginner', h: '<p><b>Image</b>: read-only, layered template + config (cmd, env, ports). Immutable, identified by a content hash. <b>Container</b>: a running or stopped instance with its own writable layer, network identity and process tree. One image → many containers.</p><p>Analogy: image = class, container = object. Or: image = frozen meal, container = the meal heated and served.</p>' },
  lifecycle: { t: 'Container lifecycle', lvl: 'Beginner', h: '<p><code>created</code> → <code>running</code> ⇄ <code>paused</code>; <code>running</code> → <code>exited</code> (stop, kill, or PID 1 ends) → <code>running</code> (start) ; any → removed (rm).</p><ul><li><code>run</code> = pull + create + start. <code>--rm</code> removes on exit.</li><li><code>stop</code>: SIGTERM, wait 10 s (<code>-t</code>), SIGKILL. <code>kill</code>: SIGKILL now.</li><li><code>pause</code>: cgroup freezer, no signal.</li><li><b>Golden rule:</b> the container lives exactly as long as PID 1.</li></ul>' },
  exitcodes: { t: 'Exit codes cheat sheet', lvl: 'Intermediate', h: '<table><tr><th>Code</th><th>Meaning</th></tr><tr><td>0</td><td>Success</td></tr><tr><td>1</td><td>Generic application error</td></tr><tr><td>125</td><td>docker run itself failed (bad flag, name conflict)</td></tr><tr><td>126</td><td>Command found but not executable</td></tr><tr><td>127</td><td>Command not found in the image</td></tr><tr><td>137</td><td>SIGKILL (128+9): OOM kill or stop timeout</td></tr><tr><td>139</td><td>SIGSEGV: segmentation fault</td></tr><tr><td>143</td><td>SIGTERM (128+15): graceful stop</td></tr></table>' },
  layers: { t: 'Layers and the union filesystem', lvl: 'Beginner', h: '<p>Each RUN/COPY/ADD/WORKDIR produces a layer: a tarball of filesystem changes, addressed by its SHA-256 digest. overlay2 stacks them into one view. Layers are shared between images and containers, so pulls download only what is missing ("Already exists").</p><p>Deleting a file in a later layer adds a <b>whiteout</b>; the bytes remain in the earlier layer. Clean up in the same RUN, or use multi-stage builds.</p>' },
  ports: { t: 'Publishing ports', lvl: 'Beginner', h: '<p><code>-p [HOST_IP:]HOST_PORT:CONTAINER_PORT[/udp]</code>. Docker installs iptables DNAT rules (and a userland proxy) so host traffic reaches the container\'s IP. <code>-p 127.0.0.1:5432:5432</code> keeps a port off your LAN. <code>-P</code> publishes every EXPOSEd port on random high ports. <b>EXPOSE</b> in a Dockerfile is documentation only.</p><p>Common errors: "port is already allocated" (another container/process has it); app listens on 127.0.0.1 inside the container (bind to 0.0.0.0).</p>' },
  namespaces: { t: 'Namespaces: what a process can see', lvl: 'Intermediate', h: '<table><tr><th>NS</th><th>Isolates</th></tr><tr><td>pid</td><td>Process IDs (app is PID 1)</td></tr><tr><td>net</td><td>Interfaces, IPs, ports, routes</td></tr><tr><td>mnt</td><td>Mount table / root filesystem</td></tr><tr><td>uts</td><td>Hostname</td></tr><tr><td>ipc</td><td>Shared memory, semaphores</td></tr><tr><td>user</td><td>UID/GID mapping (rootless, userns-remap)</td></tr><tr><td>cgroup</td><td>View of the cgroup tree</td></tr></table><p><code>docker exec</code> joins existing namespaces with setns(). <code>--network host</code>, <code>--pid host</code> share the host\'s instead.</p>' },
  cow: { t: 'Copy-on-write and the writable layer', lvl: 'Intermediate', h: '<p>Every container gets an UpperDir. Reads fall through to image layers; the first write to an image file copies it up. <code>docker diff</code> lists A/C/D changes. The writable layer survives stop/start, dies with rm, and is slower than volumes for heavy writes.</p>' },
  storage: { t: 'Volumes, bind mounts, tmpfs', lvl: 'Beginner', h: '<table><tr><th>Type</th><th>Use for</th><th>Syntax</th></tr><tr><td>Named volume</td><td>Databases, persistent app data</td><td><code>-v data:/var/lib/data</code></td></tr><tr><td>Anonymous volume</td><td>Created by VOLUME in images; easy to orphan</td><td><code>-v /path</code></td></tr><tr><td>Bind mount</td><td>Dev code, config files you edit</td><td><code>-v ./src:/app</code></td></tr><tr><td>tmpfs</td><td>Scratch files, secrets in RAM</td><td><code>--tmpfs /tmp</code></td></tr></table><p>Backups: <code>docker run --rm -v data:/data -v ./b:/b alpine tar czf /b/data.tgz -C /data .</code></p>' },
  logs: { t: 'Logging', lvl: 'Beginner', h: '<p>Docker captures stdout/stderr of PID 1. Default driver <code>json-file</code> stores them in /var/lib/docker/containers/ID/ID-json.log and can fill disks. Set rotation: <code>{"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}</code> in /etc/docker/daemon.json. Ship to central systems with fluentd, awslogs, gcplogs, journald, or an agent. Apps should log to stdout, not files.</p>' },
  env: { t: 'Configuration via environment', lvl: 'Beginner', h: '<p>One image, many environments: pass config at run time with <code>-e KEY=VAL</code> or <code>--env-file .env</code>. Follow the Twelve-Factor App: config in env, logs to stdout, stateless processes, bind to 0.0.0.0, handle SIGTERM.</p>' },
  dockerfile: { t: 'Dockerfile reference', lvl: 'Intermediate', h: '<table><tr><th>Instr.</th><th>Purpose</th></tr><tr><td>FROM</td><td>Base image / start a stage (AS name)</td></tr><tr><td>WORKDIR</td><td>Set working dir</td></tr><tr><td>COPY / ADD</td><td>Copy from context or stage (ADD also unpacks tars, fetches URLs)</td></tr><tr><td>RUN</td><td>Run a build command (layer). Supports --mount=type=cache|secret|bind</td></tr><tr><td>ENV / ARG</td><td>Runtime env / build-time variables</td></tr><tr><td>EXPOSE</td><td>Document ports</td></tr><tr><td>USER</td><td>Run as this user</td></tr><tr><td>CMD / ENTRYPOINT</td><td>Default command / fixed executable</td></tr><tr><td>HEALTHCHECK</td><td>Probe command</td></tr><tr><td>VOLUME</td><td>Declare a mount point (creates anonymous volumes)</td></tr><tr><td>STOPSIGNAL / SHELL / LABEL</td><td>Metadata</td></tr></table>' },
  context: { t: 'Build context and .dockerignore', lvl: 'Intermediate', h: '<p>The final argument of <code>docker build</code> (usually <code>.</code>) is the context: every file is sent to BuildKit. COPY can only see context files. <code>.dockerignore</code> excludes paths (glob patterns, <code>**</code>, <code>!</code> to re-include). Always ignore .git, dependency folders (node_modules, venv), build output and secrets (.env, *.pem).</p>' },
  cache: { t: 'Build cache rules', lvl: 'Intermediate', h: '<p>Key for each step = parent layer + instruction string (+ file checksums for COPY/ADD, + used ARG values). First miss invalidates everything after it. So:</p><ol><li>Stable things first (base, system packages).</li><li>Dependency manifests next (package.json, requirements.txt, go.mod) then install.</li><li>Source code last.</li></ol><p>Use <code>--no-cache</code> to force, <code>--cache-from/--cache-to</code> to share cache in CI.</p>' },
  cmdentry: { t: 'CMD vs ENTRYPOINT, shell vs exec form', lvl: 'Intermediate', h: '<p>Effective command = ENTRYPOINT + CMD. Run arguments replace CMD; <code>--entrypoint</code> replaces ENTRYPOINT and drops CMD.</p><p><b>Exec form</b> <code>["node","app.js"]</code> runs the program directly as PID 1. <b>Shell form</b> <code>node app.js</code> becomes <code>/bin/sh -c "node app.js"</code>: sh is PID 1, signals are not forwarded, variables are expanded. Prefer exec form; if you need a shell, end with <code>exec</code>.</p>' },
  registry: { t: 'Registries, tags and digests', lvl: 'Intermediate', h: '<p>Name anatomy: <code>registry/namespace/repo:tag@sha256:digest</code>. Defaults: docker.io, library, latest. Tags are mutable pointers; digests are immutable content hashes. Registries de-duplicate layers ("Mounted from"). Registries: Docker Hub, GHCR, ECR, GAR, ACR, Harbor. Never deploy :latest; use versions or git SHAs, pin by digest for reproducibility.</p>' },
  networks: { t: 'Networking', lvl: 'Intermediate', h: '<table><tr><th>Driver</th><th>Use</th></tr><tr><td>bridge (default)</td><td>docker0, IPs only, no DNS</td></tr><tr><td>user-defined bridge</td><td>Embedded DNS (127.0.0.11), isolation. Use this.</td></tr><tr><td>host</td><td>Share host network stack, no isolation</td></tr><tr><td>none</td><td>Loopback only</td></tr><tr><td>overlay</td><td>Multi-host (Swarm), VXLAN</td></tr><tr><td>macvlan/ipvlan</td><td>Container gets a LAN address</td></tr></table><p>Inside a container <code>localhost</code> is the container. Use <code>host.docker.internal</code> to reach the host.</p>' },
  compose: { t: 'Docker Compose', lvl: 'Intermediate', h: '<p>Declarative multi-container apps in <code>compose.yaml</code>: services (image/build, ports, environment, volumes, depends_on with conditions, healthcheck, restart, deploy.replicas, profiles, develop.watch), top-level volumes and networks. Commands: up -d, down [-v], ps, logs -f, exec, build, watch, config. v2 is <code>docker compose</code> (plugin); v1 <code>docker-compose</code> is retired and the <code>version:</code> key is obsolete.</p>' },
  restart: { t: 'Restart policies', lvl: 'Advanced', h: '<table><tr><th>Policy</th><th>Crash</th><th>docker stop</th><th>Reboot</th></tr><tr><td>no</td><td>stays down</td><td>stays down</td><td>stays down</td></tr><tr><td>on-failure[:N]</td><td>restart if exit≠0</td><td>stays down</td><td>restart if last exit≠0</td></tr><tr><td>unless-stopped</td><td>restart</td><td>stays down</td><td>restart unless manually stopped</td></tr><tr><td>always</td><td>restart</td><td>stays down…</td><td>…restarts on daemon start</td></tr></table>' },
  cgroups: { t: 'cgroups and resource limits', lvl: 'Advanced', h: '<p>cgroup v2 files per container: <code>memory.max</code> (-m), <code>memory.swap.max</code>, <code>cpu.max</code> (--cpus), <code>cpu.weight</code> (--cpu-shares), <code>pids.max</code> (--pids-limit), io.max. Exceeding memory.max triggers the OOM killer → exit 137, OOMKilled=true. <code>docker stats</code> reads these files live. Tools like <code>free</code> show host memory, not your limit; runtimes (JVM, Node) must be container-aware.</p>' },
  signals: { t: 'Signals, PID 1 and init', lvl: 'Advanced', h: '<p>PID 1 in a namespace ignores signals it has no handler for, and must reap zombie children. Problems: shell-form CMD (sh swallows SIGTERM), apps without SIGTERM handlers, apps that spawn children. Fixes: exec form; handle SIGTERM in code; <code>--init</code> (tini); STOPSIGNAL for apps expecting SIGQUIT/SIGINT; <code>--stop-timeout</code> for slow shutdowns.</p>' },
  health: { t: 'Health checks', lvl: 'Advanced', h: '<p><code>HEALTHCHECK --interval=30s --timeout=3s --start-period=10s --retries=3 CMD curl -f http://localhost/health || exit 1</code>. States: starting → healthy / unhealthy. Used by Compose depends_on (service_healthy), Swarm (replaces unhealthy tasks) and visible in docker ps. Kubernetes ignores Docker HEALTHCHECK and uses its own liveness/readiness probes.</p>' },
  prune: { t: 'Disk housekeeping', lvl: 'Advanced', h: '<ul><li><code>docker system df [-v]</code>: what uses space.</li><li><code>docker container prune</code>, <code>image prune [-a]</code>, <code>volume prune [-a]</code>, <code>network prune</code>, <code>builder prune</code>.</li><li><code>docker system prune [-a] [--volumes]</code>: all of the above.</li><li><code>--filter until=24h</code> limits by age.</li></ul><p>Named volumes are only removed when explicitly requested.</p>' },
  security: { t: 'Container security checklist', lvl: 'Advanced', h: '<ol><li>Small, trusted, regularly rebuilt base images.</li><li>Non-root USER.</li><li><code>--cap-drop ALL</code> + only needed caps; never <code>--privileged</code>.</li><li><code>--read-only</code> + tmpfs.</li><li><code>--security-opt no-new-privileges</code>; keep seccomp/AppArmor defaults.</li><li>Memory/CPU/PID limits.</li><li>Never mount docker.sock into untrusted containers.</li><li>No secrets in images; scan images; sign them (cosign).</li><li>Consider rootless Docker or user namespaces; gVisor/Kata for untrusted code.</li></ol>' },
  secrets: { t: 'Secrets: build time and run time', lvl: 'Advanced', h: '<p><b>Build:</b> <code>RUN --mount=type=secret,id=x</code> + <code>docker build --secret id=x,src=file</code>. Also <code>--mount=type=ssh</code> for git over SSH. Never ARG/ENV/COPY secrets; they persist in history or layers.</p><p><b>Run:</b> Compose/Swarm secrets mounted at /run/secrets, Kubernetes Secrets, cloud secret managers, Vault. Env vars are acceptable if injected at run time, but are visible in docker inspect.</p>' },
  scan: { t: 'Scanning, SBOMs and supply chain', lvl: 'Advanced', h: '<p>Docker Scout, Trivy, Grype generate an SBOM and match CVEs. BuildKit can attach SBOM and provenance attestations (<code>--sbom=true --provenance=true</code>). Sign images with cosign/Notation. Pin base images by digest and update them with Renovate/Dependabot.</p>' },
  multistage: { t: 'Multi-stage builds', lvl: 'Pro', h: '<p>Use several FROM stages: build with full toolchains, copy artifacts into a minimal final stage (distroless, alpine, scratch). BuildKit builds the stage graph in parallel and skips unneeded stages. <code>--target</code> selects a stage (dev, test, prod from one file). Typical results: Go 850 MB → 10 MB; Node frontend 1 GB → 50 MB nginx image.</p>' },
  buildkit: { t: 'BuildKit power features', lvl: 'Pro', h: '<ul><li><code>RUN --mount=type=cache,target=…</code>: persistent package caches.</li><li><code>--mount=type=secret</code>, <code>--mount=type=ssh</code>.</li><li><code>--mount=type=bind,from=stage</code>: read files without copying.</li><li>Heredocs: <code>RUN &lt;&lt;EOF … EOF</code>.</li><li>Remote cache: <code>--cache-to type=registry|gha|s3</code>.</li><li><code>docker buildx bake</code>: build many targets.</li><li><code>docker build --check</code>: lint Dockerfiles.</li></ul>' },
  multiarch: { t: 'Multi-architecture images', lvl: 'Pro', h: '<p>A tag can point to an <b>OCI image index</b> (manifest list) with one manifest per platform (linux/amd64, linux/arm64, linux/arm/v7…). Build with <code>docker buildx build --platform a,b --push</code> using QEMU or native nodes. Inspect with <code>docker buildx imagetools inspect</code>. Mismatched binaries fail with "exec format error".</p>' },
  internals: { t: 'Under the hood: OCI, overlay2, /var/lib/docker', lvl: 'Pro', h: '<p><b>OCI image spec</b>: manifest (JSON) → config blob + ordered layer tarballs, all content-addressed. <b>OCI runtime spec</b>: config.json + rootfs, executed by runc/crun/gVisor/Kata. <b>Distribution spec</b>: the registry HTTP API.</p><p>/var/lib/docker: overlay2/ (layers + UpperDirs), containers/ (config, logs), volumes/, image/, network/, buildkit/. A container\'s process is visible on the host in <code>ps</code>; its namespaces in /proc/PID/ns; its cgroup in /sys/fs/cgroup/system.slice/docker-ID.scope.</p>' },
  orchestration: { t: 'Orchestration: Swarm and Kubernetes', lvl: 'Pro', h: '<p>Orchestrators store desired state and reconcile: scheduling, failover, scaling, rolling updates, service discovery, secrets.</p><table><tr><th>Docker / Compose</th><th>Swarm</th><th>Kubernetes</th></tr><tr><td>container</td><td>task</td><td>Pod</td></tr><tr><td>service (compose)</td><td>service</td><td>Deployment + Service</td></tr><tr><td>-p 8080:80</td><td>routing mesh</td><td>Service (NodePort/LB), Ingress</td></tr><tr><td>named volume</td><td>volume</td><td>PersistentVolumeClaim</td></tr><tr><td>env / secrets</td><td>configs / secrets</td><td>ConfigMap / Secret</td></tr><tr><td>--scale web=3</td><td>--replicas 3</td><td>replicas: 3</td></tr><tr><td>HEALTHCHECK</td><td>healthcheck</td><td>liveness/readiness probes</td></tr></table><p>Managed alternatives: AWS ECS/Fargate, Google Cloud Run, Azure Container Apps.</p>' },
  whennot: { t: 'When not to use containers', lvl: 'Pro', h: '<ul><li>Desktop GUI apps (possible but awkward).</li><li>Hostile multi-tenant code: use VMs, gVisor, Kata or Firecracker.</li><li>Needs a different kernel or kernel modules.</li><li>Tiny scripts where a static binary or serverless function is simpler.</li><li>Heavy file I/O through bind mounts on macOS/Windows (VM boundary).</li></ul>' },
  cheats: { t: 'Command cheat sheet', lvl: 'Reference', h: '<pre>docker run -d --name x -p 8080:80 -v data:/d -e K=V img\ndocker ps -a · logs -f x · exec -it x sh · stop/start/rm -f x\ndocker build -t app:1 . · images · history app:1 · tag · push\ndocker network create n · volume create v · inspect x\ndocker compose up -d · ps · logs -f · down [-v]\ndocker system df · system prune [-a] [--volumes]\ndocker stats · top x · diff x · cp x:/f .\ndocker buildx build --platform linux/amd64,linux/arm64 --push .\ndocker swarm init · service create --replicas 3 · service ps</pre>' }
};

var SANDBOX_IDEAS = ['docker run -it ubuntu bash', 'docker run -d --name web -p 8080:80 nginx', 'docker compose up -d   (after a mission set up compose.yaml)', 'docker network create lab && docker run -d --network lab --name a busybox sleep 9999', 'docker run --rm --read-only --cap-drop ALL alpine sh -c "id; touch /x"', 'sim host-arch arm64 && docker run quest/legacy:1.0', 'docker swarm init && docker service create --replicas 3 -p 8080:80 nginx'];

return { CH: CH, M: M, BADGES: BADGES, RANKS: RANKS, CODEX: CODEX, SANDBOX_IDEAS: SANDBOX_IDEAS, E: E, projPython: projPython };
})(typeof DQ !== 'undefined' ? DQ : require('./engine.js'));
if (typeof module !== 'undefined') module.exports = QUEST;
</script>
<script>
/* ================================================================
   Docker Quest — UI: rendering, terminal, narration, progress
   ================================================================ */
(function () {
'use strict';
var Q = QUEST;
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var fmt = DQ.fmtSize, fmtMiB = DQ.fmtMiB;
var KEY = 'docker-quest-v1';
var SPEED = { slow: 900, normal: 430, fast: 140, instant: 0 };
var P = load();
function load() {
  try { var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.v === 1) return d; } catch (e) { /* storage unavailable */ }
  return { v: 1, xp: 0, done: {}, badges: {}, unlockAll: false, codexAll: false, speed: 'normal', last: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* ignore */ } }

var S = { w: null, ms: null, m: {}, done: [], hints: {}, sel: null, tab: 'overview', view: 'host', ctab: 'term', file: null, hist: [], hi: 0, timers: [], groups: 0, sandbox: false, qz: null, completed: false, fileDirty: false };

/* ---------------- helpers ---------------- */
function hue(id) { return parseInt(String(id).replace(/[^0-9a-f]/g, '').slice(0, 4) || '0', 16) % 360; }
function mIndex(id) { for (var i = 0; i < Q.M.length; i++) if (Q.M[i].id === id) return i; return -1; }
function unlocked(i) { return P.unlockAll || i === 0 || !!P.done[Q.M[i - 1].id] || !!P.done[Q.M[i].id]; }
function rankOf(xp) { var r = Q.RANKS[0], nx = null; for (var i = 0; i < Q.RANKS.length; i++) { if (xp >= Q.RANKS[i][0]) { r = Q.RANKS[i]; nx = Q.RANKS[i + 1] || null; } } return { r: r, nx: nx }; }
function chapter(n) { return Q.CH[n - 1]; }
function toast(icon, title, text) {
  var t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<div class="ti">' + esc(icon) + '</div><div><b>' + esc(title) + '</b>' + esc(text || '') + '</div>';
  $('#toasts').appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 3600);
  setTimeout(function () { t.remove(); }, 4100);
}
function unlockedCodex() {
  var u = { cheats: 1 };
  Q.M.forEach(function (m) { if (P.done[m.id]) (m.codex || []).forEach(function (c) { u[c] = 1; }); });
  if (P.done['8-4']) u.whennot = 1;
  return u;
}
function codexSource(id) { for (var i = 0; i < Q.M.length; i++) if ((Q.M[i].codex || []).indexOf(id) >= 0) return Q.M[i]; return null; }

/* ---------------- header ---------------- */
function renderHeader() {
  var rk = rankOf(P.xp);
  $('#rankName').innerHTML = esc(rk.r[1]) + '<small>' + (rk.nx ? 'next: ' + esc(rk.nx[1]) + ' at ' + rk.nx[0] : 'max rank reached') + '</small>';
  var lo = rk.r[0], hi = rk.nx ? rk.nx[0] : P.xp || 1;
  $('#xpFill').style.width = (rk.nx ? Math.min(100, (P.xp - lo) / (hi - lo) * 100) : 100) + '%';
  $('#xpNum').textContent = P.xp + ' XP';
  $('#badgeCount').textContent = Object.keys(P.badges).length + '/' + Object.keys(Q.BADGES).length;
  $('#speed').value = P.speed;
}
function addXP(n, why) {
  if (!n) return;
  var before = rankOf(P.xp).r[1];
  P.xp += n; save(); renderHeader();
  var after = rankOf(P.xp).r[1];
  if (after !== before) toast('⬆', 'Promoted to ' + after, ' · keep going');
}
function award(id) {
  if (!id || P.badges[id] || !Q.BADGES[id]) return false;
  P.badges[id] = Date.now(); save(); renderHeader();
  var b = Q.BADGES[id];
  toast(b.icon, 'Badge: ' + b.name, ' · ' + b.desc);
  return true;
}

/* ---------------- missions ---------------- */
function openMission(id) {
  var i = mIndex(id); if (i < 0) i = 0;
  var ms = Q.M[i];
  clearTimers();
  S.ms = ms; S.sandbox = false; S.m = {}; S.hints = {}; S.sel = null; S.tab = 'overview'; S.completed = false; S.view = 'host';
  S.done = ms.goals ? ms.goals.map(function () { return false; }) : [];
  S.w = new DQ.World();
  if (ms.setup) ms.setup(S.w, S.m);
  S.w.R = null;
  S.qz = ms.type === 'quiz' ? { i: 0, res: [], picked: null } : null;
  S.file = ms.files ? ms.files[0] : (S.w.host.files.Dockerfile ? 'Dockerfile' : null);
  P.last = ms.id; save();
  $('#term').innerHTML = '';
  $('#tl').innerHTML = '';
  S.groups = 0;
  if (ms.type === 'quiz') termLine('note', 'Checkpoint quiz: answer in the mission panel. The terminal still works if you want to test an idea.');
  else {
    termLine('note', 'Fresh simulated host ready for mission ' + ms.id + ' · ' + ms.title + '.');
    termLine('note', 'Type commands below. "help" lists what works; "sim help" lists simulator controls.');
  }
  setCTab(ms.files && ms.files.length && ms.id !== '3-1' ? 'term' : 'term');
  $('#filesDot').innerHTML = ms.files ? '<span class="badge" title="this mission has files to read or edit"></span>' : '';
  renderAll();
  if (window.innerWidth > 1100) $('#cmd').focus({ preventScroll: true });
}
function openSandbox() {
  clearTimers();
  S.sandbox = true; S.ms = null; S.done = []; S.hints = {}; S.sel = null; S.qz = null; S.completed = false;
  S.w = new DQ.World();
  Q.projPython(S.w, { good: true, ignore: true, compose: true });
  S.w.setFiles({ 'site/index.html': '<h1>Sandbox site</h1>\n' });
  S.file = 'Dockerfile';
  $('#term').innerHTML = ''; $('#tl').innerHTML = ''; S.groups = 0;
  termLine('note', 'Sandbox: a clean host with a sample project (Dockerfile, compose.yaml, app.py). Nothing here is graded. Break things.');
  $('#filesDot').innerHTML = '';
  renderAll();
}
function renderMission() {
  var el = $('#mBody'), ms = S.ms;
  if (S.sandbox) {
    el.innerHTML = '<div class="chap">Free play</div><h2 class="mt">Sandbox</h2><p class="brief">Everything you have learned, with no goals. The host comes with the Flask + Redis project, so <code>docker build</code> and <code>docker compose up</code> work right away.</p>' +
      '<div class="sec"><h6>Ideas to try</h6><div class="hint">' + Q.SANDBOX_IDEAS.map(function (c) { return '<button type="button" class="cmdchip" data-cmd="' + esc(c.split('   ')[0]) + '"><span>' + esc(c) + '</span><b>insert</b></button>'; }).join('') + '</div></div>' +
      '<div class="reward"><button type="button" class="btn" id="resetSb">Wipe sandbox host</button><button type="button" class="btn pri" id="backM">Back to missions</button></div>';
    $('#resetSb').onclick = openSandbox;
    $('#backM').onclick = function () { openMission(P.last || Q.M[0].id); };
    bindChips(el);
    return;
  }
  var ch = chapter(ms.ch), idx = mIndex(ms.id);
  var chMs = Q.M.filter(function (x) { return x.ch === ms.ch; });
  var pos = chMs.indexOf(ms) + 1;
  var h = '<div class="chap"><span>Chapter ' + ms.ch + ' · ' + esc(ch.title) + '</span><span class="lvl">' + esc(ch.rank) + '</span><span class="lvl">' + pos + '/' + chMs.length + '</span></div>';
  h += '<h2 class="mt">' + esc(ms.title) + '</h2>';
  if (ms.type === 'quiz') { el.innerHTML = h + renderQuiz(); bindQuiz(); return; }
  h += '<p class="brief">' + esc(ms.brief) + '</p>';
  h += '<details class="learn" ' + (S.completed ? '' : 'open') + '><summary>Briefing: the concept</summary><div class="lb">' + ms.learn + '</div></details>';
  h += '<ol class="goals">';
  var firstOpen = S.done.indexOf(false);
  ms.goals.forEach(function (g, i) {
    var cls = 'goal' + (S.done[i] ? ' done' : '') + (i === firstOpen ? ' now' : '');
    h += '<li class="' + cls + '" data-g="' + i + '"><div class="row"><div class="chk">✓</div><div class="gt">' + esc(g.text) + '</div>' + (S.done[i] || S.hints[i] ? '' : '<button type="button" class="hintbtn" data-hint="' + i + '">hint −15%</button>') + '</div>';
    if (S.hints[i] && !S.done[i]) {
      h += '<div class="hint">';
      if (g.file) h += '<button type="button" class="cmdchip" data-apply="' + i + '"><span>Apply the suggested ' + esc(g.file.name) + ' (opens in Files)</span><b>apply</b></button>';
      else {
        var hc = typeof g.hint === 'function' ? g.hint(S.w, S.m) : g.hint;
        hc.split('\n').forEach(function (c) { h += '<button type="button" class="cmdchip" data-cmd="' + esc(c) + '"><span>' + esc(c) + '</span><b>insert</b></button>'; });
      }
      h += '</div>';
    }
    h += '</li>';
  });
  h += '</ol>';
  var hc2 = Object.keys(S.hints).length, factor = Math.max(0.4, 1 - 0.15 * hc2), prev = P.done[ms.id];
  if (!S.completed) h += '<div class="reward"><span>Reward</span><span class="xp">+' + Math.round(ms.xp * factor) + ' XP</span>' + (hc2 ? '<span>(' + hc2 + ' hint' + (hc2 > 1 ? 's' : '') + ' used)</span>' : '') + (ms.badge && !P.badges[ms.badge] ? '<span>· badge: ' + esc(Q.BADGES[ms.badge].name) + '</span>' : '') + (prev ? '<span>· completed before (' + prev.xp + ' XP)</span>' : '') + '<span style="flex:1"></span><button type="button" class="btn sm" id="restartM">Restart mission</button></div>';
  if (S.completed) {
    var nxt = Q.M[idx + 1];
    h += '<div class="complete"><h3>Mission complete</h3><div class="gain">' + esc(S.gainText || '') + '</div>' + ms.wrap;
    var cx = (ms.codex || []).filter(function (c) { return Q.CODEX[c]; });
    if (cx.length) h += '<div class="unlocks">' + cx.map(function (c) { return '<span>◫ ' + esc(Q.CODEX[c].t) + '</span>'; }).join('') + '</div>';
    h += '<div class="acts">' + (nxt ? '<button type="button" class="btn amb" id="nextM">Next: ' + esc(nxt.title) + ' →</button>' : '') + '<button type="button" class="btn" id="stayM">Keep experimenting here</button>' + (cx.length ? '<button type="button" class="btn" id="readCx">Read in Codex</button>' : '') + '</div></div>';
  }

    h += '</div></div>';
  });
  h += '</div><div class="reward" style="margin-top:16px"><button type="button" class="btn ghost sm" id="resetP">Reset all progress…</button><span id="resetC"></span></div>';
  $('#mapBody').innerHTML = h;
  $$('[data-m]', $('#mapBody')).forEach(function (b) { b.onclick = function () { closeOv(); openMission(b.dataset.m); }; });
  $('#resetP').onclick = function () {
    $('#resetC').innerHTML = '<span class="confirm">Erase XP, badges and completed missions? <button type="button" class="btn sm" id="rpYes">Yes, reset</button><button type="button" class="btn sm" id="rpNo">Cancel</button></span>';
    $('#rpYes').onclick = function () { P = { v: 1, xp: 0, done: {}, badges: {}, unlockAll: false, codexAll: false, speed: P.speed, last: null }; save(); renderHeader(); closeOv(); openMission(Q.M[0].id); };
    $('#rpNo').onclick = function () { $('#resetC').innerHTML = ''; };
  };
  openOv('ovMap');
}
function openCodex(id) {
  $('#codexAll').checked = !!P.codexAll;
  var u = unlockedCodex(), keys = Object.keys(Q.CODEX);
  var cur = id && (u[id] || P.codexAll) ? id : keys.filter(function (k) { return u[k] || P.codexAll; })[0];
  var h = '<div class="codex"><div class="cxl">';
  keys.forEach(function (k) { var ok = u[k] || P.codexAll, src = codexSource(k); h += '<button type="button" data-c="' + k + '" class="' + (k === cur ? 'on' : '') + '"' + (ok ? '' : ' disabled title="Unlocks with mission ' + (src ? src.id + ' ' + src.title : '') + '"') + '>' + (ok ? '◫' : '🔒') + ' ' + esc(Q.CODEX[k].t) + '<small>' + esc(Q.CODEX[k].lvl) + '</small></button>'; });
  h += '</div><div class="cxc">' + (cur ? '<h3>' + esc(Q.CODEX[cur].t) + '</h3><div class="chap" style="margin-bottom:8px">' + esc(Q.CODEX[cur].lvl) + '</div><div class="tblw">' + Q.CODEX[cur].h + '</div>' : '<p>Complete missions to unlock entries.</p>') + '</div></div>';
  $('#codexBody').innerHTML = h;
  $$('[data-c]', $('#codexBody')).forEach(function (b) { b.onclick = function () { openCodex(b.dataset.c); }; });
  openOv('ovCodex');
}
function openBadges() {
  $('#badgeBody').innerHTML = '<div class="bdg">' + Object.keys(Q.BADGES).map(function (k) { var b = Q.BADGES[k], got = P.badges[k]; return '<div class="bd' + (got ? ' got' : '') + '"><div class="ic">' + esc(b.icon) + '</div><b>' + esc(b.name) + '</b><span>' + esc(b.desc) + '</span></div>'; }).join('') + '</div>';
  openOv('ovBadges');
}

/* ---------------- wiring ---------------- */
function renderAll() { renderHeader(); renderMission(); renderWorld(); renderInspector(); updatePrompt(); if (S.ctab === 'files') renderFiles(); }
function init() {
  var inp = $('#cmd');
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var v = inp.value; inp.value = ''; runCommand(v); }
    else if (e.key === 'ArrowUp') { if (S.hi > 0) { S.hi--; inp.value = S.hist[S.hi] || ''; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (S.hi < S.hist.length) { S.hi++; inp.value = S.hist[S.hi] || ''; } e.preventDefault(); }
    else if (e.key === 'Tab') { e.preventDefault(); complete(inp); }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); $('#term').innerHTML = ''; }
  });
  $('#runBtn').onclick = function () { var v = inp.value; inp.value = ''; runCommand(v); inp.focus(); };
  $('#term').addEventListener('click', function () { if (!window.getSelection().toString()) inp.focus(); });
  $('#tTerm').onclick = function () { if (S.fileDirty) saveFile(); setCTab('term'); inp.focus(); };
  $('#tFiles').onclick = function () { setCTab('files'); };
  $('#tClear').onclick = function () { $('#term').innerHTML = ''; };
  var ta = $('#fedit');
  ta.addEventListener('input', function () { S.fileDirty = true; $('#fstate').textContent = 'modified'; });
  ta.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
    if (e.key === 'Tab') { e.preventDefault(); var s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; S.fileDirty = true; }
  });
  $('#fsave').onclick = saveFile;
  $('#frevert').onclick = function () { renderFiles(); };
  $('#bMap').onclick = openMap;
  $('#bCodex').onclick = function () { openCodex(); };
  $('#bBadges').onclick = openBadges;
  $('#bSandbox').onclick = openSandbox;
  $('#speed').onchange = function () { P.speed = this.value; save(); };
  $('#unlockAll').onchange = function () { P.unlockAll = this.checked; save(); openMap(); };
  $('#codexAll').onchange = function () { P.codexAll = this.checked; save(); openCodex(); };
  $$('[data-close]').forEach(function (b) { b.onclick = closeOv; });
  $$('.ov').forEach(function (o) { o.addEventListener('click', function (e) { if (e.target === o) closeOv(); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOv(); });
  var start = P.last && mIndex(P.last) >= 0 ? P.last : Q.M[0].id;
  openMission(start);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body></html>
