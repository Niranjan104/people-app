<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Docker Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control-room console. Left = mission brief, centre = live engine room over a terminal, right = step trace + inspector. Dark-first. */
:root{
  --bg:#0b1216; --panel:#101a20; --panel2:#15222a; --line:#1f2f37; --line2:#2d434d;
  --ink:#dbe6ea; --muted:#8ea3ab; --dim:#5f757e;
  --accent:#4cc2d6; --accent-ink:#04191e; --accent-soft:#123541;
  --amber:#f2b34a; --amber-ink:#2a1c02; --amber-soft:#3a2c12;
  --good:#4cc283; --good-soft:#10331f; --bad:#ef7a6c; --bad-soft:#3b1814; --info:#8ab4ff;
  --term-bg:#060d10; --term-ink:#cfe0e4; --term-dim:#6d878f;
  --layer-s:44%; --layer-l:44%;
  --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf2f4; --panel:#ffffff; --panel2:#f3f7f8; --line:#d7e1e5; --line2:#b9c9cf;
    --ink:#0f1e26; --muted:#4c616a; --dim:#7a8f98;
    --accent:#0a6a7c; --accent-ink:#ffffff; --accent-soft:#d6edf2;
    --amber:#a86400; --amber-ink:#ffffff; --amber-soft:#fbecd0;
    --good:#1d7a46; --good-soft:#dcf2e5; --bad:#b4372b; --bad-soft:#f9e0dc; --info:#2b5cb8;
    --term-bg:#0f1c22; --term-ink:#d6e4e8; --term-dim:#7d979e;
    --layer-s:46%; --layer-l:64%;
    --shadow:0 10px 30px -20px rgba(15,30,38,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf2f4; --panel:#ffffff; --panel2:#f3f7f8; --line:#d7e1e5; --line2:#b9c9cf;
  --ink:#0f1e26; --muted:#4c616a; --dim:#7a8f98;
  --accent:#0a6a7c; --accent-ink:#ffffff; --accent-soft:#d6edf2;
  --amber:#a86400; --amber-ink:#ffffff; --amber-soft:#fbecd0;
  --good:#1d7a46; --good-soft:#dcf2e5; --bad:#b4372b; --bad-soft:#f9e0dc; --info:#2b5cb8;
  --term-bg:#0f1c22; --term-ink:#d6e4e8; --term-dim:#7d979e;
  --layer-s:46%; --layer-l:64%;
  --shadow:0 10px 30px -20px rgba(15,30,38,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,pre,.mono,textarea{font-family:var(--font-mono);font-variant-ligatures:none}
:not(pre)>code{font-size:.86em;background:var(--panel2);border:1px solid var(--line);padding:.05em .35em;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.rank{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px;max-width:460px}
.rank .nm{font-weight:600;white-space:nowrap}
.rank .nm small{display:block;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--font-mono);letter-spacing:.04em}
.xpbar{flex:1;height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--accent));transition:width .6s}
.xpnum{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.amb{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
select.btn{padding-right:6px}

/* app grid */
.app{display:grid;grid-template-columns:330px minmax(0,1fr) 350px;gap:12px;height:calc(100dvh - 54px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:12px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0}
.scroll{overflow:auto;min-height:0}
.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hd .sp{flex:1}

/* mission panel */
#mission{flex:1;display:flex;flex-direction:column}
#mission .body{padding:16px 16px 18px;overflow:auto;flex:1}
.chap{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvl{border:1px solid var(--line2);border-radius:99px;padding:0 7px;color:var(--muted)}
.mt{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1;margin:6px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.brief{color:var(--ink);margin:0 0 12px}
details.learn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:14px}
details.learn summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.learn summary::-webkit-details-marker{display:none}
details.learn summary::before{content:"▸";color:var(--accent);transition:transform .2s}
details.learn[open] summary::before{transform:rotate(90deg)}
.learn .lb{padding-bottom:10px;font-size:13.5px}
.learn .lb p{margin:.35em 0}.learn .lb ul{margin:.3em 0;padding-left:1.2em}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.goal{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel)}
.goal .row{display:flex;gap:10px;align-items:flex-start}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:transparent;transition:all .25s}
.goal.done{background:var(--good-soft);border-color:transparent}
.goal.done .chk{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.goal.done .gt{color:var(--muted)}
.goal.now{border-color:var(--accent)}
.gt{flex:1;min-width:0}
.hintbtn{font-size:11.5px;color:var(--muted);background:none;border:1px dashed var(--line2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.hintbtn:hover{color:var(--amber);border-color:var(--amber)}
.hint{margin-top:8px;display:grid;gap:6px}
.cmdchip{display:flex;align-items:center;gap:8px;background:var(--term-bg);color:var(--term-ink);border-radius:7px;padding:5px 8px;font-family:var(--font-mono);font-size:12px;border:1px solid transparent;text-align:left;width:100%}
.cmdchip:hover{border-color:var(--accent)}
.cmdchip span{flex:1;min-width:0;overflow-wrap:anywhere}
.cmdchip b{color:var(--accent);font-weight:600;font-size:11px}
.reward{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.reward .xp{font-family:var(--font-mono);color:var(--amber);font-weight:600}
.complete{margin-top:14px;border-radius:12px;padding:14px;background:linear-gradient(140deg,var(--amber-soft),var(--accent-soft));border:1px solid var(--line2)}
.complete h3{font-family:var(--font-display);margin:0 0 4px;font-size:19px}
.complete .gain{font-family:var(--font-mono);color:var(--amber);font-weight:600}
.complete p{margin:.45em 0;font-size:13.5px}
.complete .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.unlocks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unlocks span{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:1px 8px;background:var(--panel)}
.quiz .q{font-weight:600;font-size:15.5px;margin:10px 0}
.quiz .opts{display:grid;gap:7px}
.quiz .opt{text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:9px 11px}
.quiz .opt:hover:not([disabled]){border-color:var(--accent)}
.quiz .opt.right{background:var(--good-soft);border-color:var(--good)}
.quiz .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.quiz .why{margin-top:10px;font-size:13.5px;padding:9px 11px;border-radius:9px;background:var(--panel2)}
.qprog{display:flex;gap:4px;margin-top:10px}
.qprog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.qprog i.ok{background:var(--good)}.qprog i.no{background:var(--bad)}.qprog i.cur{background:var(--accent)}

/* engine room */
.stage{display:grid;grid-template-rows:minmax(0,1fr) 330px;gap:12px;min-height:0}
#engine{display:flex;flex-direction:column;overflow:hidden}
#engine .eb{overflow:auto;padding:12px;display:grid;gap:12px;align-content:start}
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:6px}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;padding:6px 8px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);font-size:12px;font-weight:600;text-align:center;transition:all .25s;position:relative}
.pn small{font-family:var(--font-mono);font-size:10px;color:var(--muted);font-weight:400}
.pn.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);transform:translateY(-1px)}
.pn.hot small{color:var(--accent-ink)}
.pn.side.hot{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 25%,transparent)}
.pn.side.hot small{color:var(--amber-ink)}
.par{display:flex;align-items:center;color:var(--dim);padding:0 3px;font-size:13px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.subs .lbl{font-family:var(--font-mono);font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.subs .pn{flex-direction:row;gap:6px;min-width:0;padding:4px 9px}
.world{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,.8fr);gap:12px}
.zone{border:1px dashed var(--line2);border-radius:11px;padding:10px;min-width:0;background:color-mix(in srgb,var(--panel2) 55%,transparent)}
.zone h4{margin:0 0 8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.zone h4 b{color:var(--ink);font-weight:600}
.zone .empty{color:var(--dim);font-size:12.5px;padding:6px 2px}
.items{display:grid;gap:8px}
.obj{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 9px;cursor:pointer;min-width:0;transition:border-color .2s, box-shadow .3s}
.obj:hover{border-color:var(--line2)}
.obj.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.obj .on{display:flex;align-items:center;gap:7px;min-width:0}
.obj .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.obj .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.st-running .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.st-paused .dot{background:var(--amber)}
.st-created .dot{background:var(--info)}
.st-exited{opacity:.72}
.pill{font-family:var(--font-mono);font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.pill.amb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.port{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip.vol{border-color:color-mix(in srgb,var(--amber) 45%,transparent);color:var(--amber)}
.chip.danger{border-color:var(--bad);color:var(--bad)}
.meter{height:5px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .5s}
.meter i.hi{background:var(--bad)}
.stack{display:flex;flex-direction:column-reverse;gap:2px;margin-top:7px}
.ly{height:7px;border-radius:3px;background:hsl(var(--h) var(--layer-s) var(--layer-l));min-width:6%}
.ly.app{outline:1px solid var(--ink);outline-offset:-1px}
.imgsize{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.reg .obj{padding:6px 8px}
details.more summary{cursor:pointer;font-size:11.5px;color:var(--muted);padding:4px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"\25B8  ";color:var(--accent)}
details.more[open] summary::before{content:"\25BE  "}
.reg .nm{font-family:var(--font-mono);font-weight:500;font-size:12px}
.reg .mine .nm{color:var(--amber)}
.lower{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.lane{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);margin-bottom:6px;cursor:pointer}
.lane .on{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lane .nm{font-weight:600;font-size:12.5px}
.lane .mem{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:6px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--panel2) 0 10px,transparent 10px 14px);min-height:30px}
.lane .mem .chip{background:var(--panel)}
.vols{display:flex;flex-wrap:wrap;gap:7px}
.vol{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 9px;cursor:pointer;min-width:0;max-width:100%}
.vol svg{width:16px;height:18px;flex:none}
.vol .nm{font-family:var(--font-mono);font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol .meta{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.lab{border:1px solid var(--line2);border-radius:11px;padding:10px;background:var(--panel)}
.lab h4{margin:0 0 8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab h4 .sp{flex:1}
.bs{display:grid;grid-template-columns:62px minmax(0,1fr) 120px 58px;gap:8px;align-items:center;font-size:12px;padding:3px 0;border-top:1px solid var(--line)}
.bs:first-of-type{border-top:0}
.bs .tag{font-family:var(--font-mono);font-size:10px;font-weight:600;text-align:center;border-radius:5px;padding:1px 0}
.bs .tag.c{background:var(--panel2);color:var(--muted)}
.bs .tag.r{background:var(--amber);color:var(--amber-ink)}
.bs .tag.f{background:var(--accent-soft);color:var(--accent)}
.bs .tx{font-family:var(--font-mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs .tm{height:7px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bs .tm i{display:block;height:100%;background:var(--amber)}
.bs .sz{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bs.cached .tx{color:var(--muted)}
.ctx{display:flex;gap:10px;align-items:center;font-size:12px;margin-top:8px;flex-wrap:wrap;color:var(--muted)}
.ctx .meter{flex:1;min-width:120px;margin:0}
.cluster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.node{border:1px solid var(--line2);border-radius:10px;padding:9px;background:var(--panel)}
.node.down{opacity:.45;border-style:dashed}
.node h5{margin:0 0 6px;font-size:13px;display:flex;gap:6px;align-items:center}
.task{font-family:var(--font-mono);font-size:11px;padding:4px 7px;border-radius:6px;background:var(--accent-soft);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
.task.old{background:var(--panel2);color:var(--dim);text-decoration:line-through}
.viewtog{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.viewtog button{border:0;background:transparent;padding:2px 9px;font-size:11px;font-family:var(--font-mono);color:var(--muted)}
.viewtog button.on{background:var(--accent);color:var(--accent-ink)}

/* console */
#console{display:flex;flex-direction:column;overflow:hidden;background:var(--term-bg);border-color:var(--line2)}
#console .hd{background:color-mix(in srgb,var(--term-bg) 80%,var(--panel));border-color:#1d2c33;color:var(--term-dim)}
.ctabs{display:flex;gap:4px}
.ctabs button{border:0;background:transparent;color:var(--term-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.ctabs button.on{background:#183038;color:var(--term-ink)}
.ctabs button .badge{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle}
.inside{font-family:var(--font-mono);font-size:11px;color:#f2b34a;text-transform:none;letter-spacing:0}
#term{font-variant-ligatures:none;flex:1;overflow:auto;padding:10px 12px 4px;font-family:var(--font-mono);font-size:12.8px;line-height:1.5;color:var(--term-ink);white-space:pre-wrap;word-break:break-word}
#term .l-err{color:#ff8f80}
#term .l-note{color:#8fb0b8;font-style:italic}
#term .l-cmd{color:#fff;font-weight:600}
#term .l-cmd .pr{color:#5fd1e3;font-weight:400}
#term .l-ok{color:#7be0a6}
.tin{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;border-top:1px solid #1d2c33;font-family:var(--font-mono);font-size:13px}
.tin .pr{color:#5fd1e3;white-space:nowrap}

add({ id: '1-1', ch: 1, title: 'Wake the engine', xp: 100, codex: ['what', 'arch'],
  brief: 'Your first shift at the container port. Before moving any cargo, check that the crane is powered: ask the Docker daemon who it is.',
  learn: '<p>The <code>docker</code> command you type is only a <b>client</b>. It sends HTTP requests over a Unix socket (<code>/var/run/docker.sock</code>) to a background service, the <b>daemon</b> <code>dockerd</code>, which does the real work with help from <code>containerd</code> and <code>runc</code>.</p><p>Watch the pipeline strip at the top of the engine room light up as each part takes its turn.</p>',
  setup: function (w) { },
  goals: [
    { text: 'Ask both halves for their version', hint: 'docker version', check: function (ev) { return E(ev, 'version'); } },
    { text: 'Get a system report from the daemon', hint: 'docker info', check: function (ev) { return E(ev, 'info'); } }
  ],
  wrap: '<p>You saw a <b>Client</b> section and a <b>Server</b> section. They are separate programs. That is why <code>docker</code> can control a daemon on another machine (<code>docker context</code>), and why the error "Cannot connect to the Docker daemon" means the server half is not running.</p>' });

add({ id: '1-2', ch: 1, title: 'Hello, container', xp: 120, badge: 'hello', codex: ['imgvsctr', 'lifecycle'],
  brief: 'Run the smallest container there is, then find it again after it has finished.',
  learn: '<p><code>docker run</code> is three steps in one: <b>pull</b> the image if it is missing, <b>create</b> a container from it, and <b>start</b> it.</p><p>A container lives only as long as its main process (PID 1). <code>hello-world</code> prints a message and exits, so the container stops, but it is <i>not deleted</i>.</p>',
  goals: [
    { text: 'Run the hello-world image', hint: 'docker run hello-world', check: function (ev) { return E(ev, 'run', function (e) { return /^hello-world/.test(e.imageName); }); } },
    { text: 'List ALL containers, including stopped ones', hint: 'docker ps -a', check: function (ev) { return E(ev, 'ps', function (e) { return e.all; }); } }
  ],
  wrap: '<p>Plain <code>docker ps</code> hides stopped containers. With <code>-a</code> you saw yours as <b>Exited (0)</b>: it ran, succeeded, and stopped. Docker gave it a random name like <code>zen_curie</code> because you did not pass <code>--name</code>.</p>' });

add({ id: '1-3', ch: 1, title: 'One image, many containers', xp: 130, codex: ['layers'],
  brief: 'The port needs two identical web servers. Download the nginx image once and start two containers from it.',
  learn: '<p>An <b>image</b> is a read-only template. A <b>container</b> is a running instance with its own thin writable layer on top. Like a class and its objects, one image can back any number of containers.</p><p>Notice in the engine room that both containers link to the <i>same</i> image card: the image layers exist only once on disk.</p>',
  goals: [
    { text: 'Pull the nginx image', hint: 'docker pull nginx', check: function (ev) { return E(ev, 'pull', function (e) { return /^nginx:/.test(e.ref); }); } },
    { text: 'Run two nginx containers in the background (-d)', hint: 'docker run -d --name web1 nginx\ndocker run -d --name web2 nginx', check: function (ev, w) { var i = w.resolveImage('nginx'); return !!i && running(w, function (c) { return c.image === i.id; }).length >= 2; } },
    { text: 'List the images on this host', hint: 'docker images', check: function (ev) { return E(ev, 'images'); } }
  ],
  wrap: '<p>Two containers, one 187 MB image. <code>-d</code> (detached) ran them in the background and printed their IDs. Each got its own name, IP address and writable layer while sharing every byte of the image.</p>' });

add({ id: '1-4', ch: 1, title: 'Open a port', xp: 140, badge: 'port', codex: ['ports'],
  brief: 'Customers outside the yard need to reach your web server. Publish a port and visit it.',
  learn: '<p>Every container gets a private network. Nothing outside can reach it until you <b>publish</b> a port with <code>-p HOST:CONTAINER</code>. Docker then adds a NAT rule so traffic to the host port is forwarded to the container port.</p><p><code>-p 8080:80</code> means: host port 8080 → port 80 inside. The left number is always your machine.</p>',
  setup: function (w) { w.preload(['nginx']); },
  goals: [
    { text: 'Run nginx named "site" with host port 8080 → container port 80', hint: 'docker run -d --name site -p 8080:80 nginx', check: function (ev, w) { return running(w, function (c) { return c.cfg.ports.some(function (p) { return p.host === 8080 && p.cport === 80; }); }).length > 0; } },
    { text: 'See the PORTS column in docker ps', hint: 'docker ps', check: function (ev) { return E(ev, 'ps'); } },
    { text: 'Visit it from the host', hint: 'curl localhost:8080', check: function (ev) { return E(ev, 'curl', function (e) { return e.ok; }); } }
  ],
  wrap: '<p>The request went host:8080 → iptables DNAT → container IP:80 → nginx. Try <code>curl localhost:9090</code> to see what happens when nothing is published there, or start another container with <code>-p 8080:80</code> to see a port conflict.</p>' });

add({ id: '1-5', ch: 1, title: 'Life and death of a container', xp: 150, codex: ['lifecycle', 'exitcodes'],
  brief: 'Container "site" is running. Walk it through every state: stop, start, pause, unpause, and finally remove it.',
  learn: '<p>States: <b>created → running ⇄ paused</b>, <b>running → exited</b> (stop, or the process ends), <b>exited → running</b> (start), and <b>removed</b>.</p><ul><li><code>stop</code> sends SIGTERM, waits 10 s, then SIGKILL.</li><li><code>pause</code> freezes processes with the cgroup freezer. No signal is sent.</li><li><code>rm</code> deletes the container and its writable layer. A running container needs <code>rm -f</code>.</li></ul>',
  setup: function (w) { w.preload(['nginx']); w.silent('docker run -d --name site -p 8080:80 nginx'); },
  goals: [
    { text: 'Stop "site"', hint: 'docker stop site', check: function (ev) { return E(ev, 'stop', function (e) { return e.name === 'site'; }); } },
    { text: 'Start the same container again', hint: 'docker start site', check: function (ev) { return E(ev, 'started', function (e) { return e.name === 'site'; }); } },
    { text: 'Pause it, then unpause it', hint: 'docker pause site\ndocker unpause site', check: function (ev) { return E(ev, 'unpause'); } },
    { text: 'Remove it for good', hint: 'docker rm -f site', check: function (ev) { return E(ev, 'rm', function (e) { return e.name === 'site'; }); } }
  ],
  wrap: '<p><code>docker start</code> restarted the <i>same</i> container: same ID, same writable layer. Only <code>rm</code> deletes it. Exit codes worth memorising: <b>0</b> success, <b>1</b> app error, <b>125</b> Docker error, <b>126/127</b> command not executable/not found, <b>137</b> SIGKILL (often OOM), <b>143</b> SIGTERM.</p>' });

add({ id: '1-q', ch: 1, title: 'Checkpoint: First Contact', type: 'quiz', xp: 0, codex: [],
  questions: [
    { q: 'What does the docker CLI actually do when you type a command?', o: ['Runs the container itself', 'Sends an API request to the dockerd daemon', 'Starts a virtual machine', 'Downloads a script and runs it'], a: 1, why: 'The CLI is a client. dockerd (with containerd and runc) does the work.' },
    { q: '"docker run nginx" on a fresh machine performs which steps?', o: ['create only', 'pull, create, start', 'build, push, run', 'start only'], a: 1, why: 'run = pull (if missing) + create + start.' },
    { q: 'Why does the hello-world container show "Exited (0)"?', o: ['It crashed', 'Its main process finished successfully', 'Docker ran out of memory', 'It was removed'], a: 1, why: 'A container lives as long as PID 1. hello-world prints and exits with 0.' },
    { q: 'In -p 3000:80, which number is the host port?', o: ['80', '3000', 'Both', 'Neither: it is random'], a: 1, why: 'Always HOST:CONTAINER.' },
    { q: 'Two containers run from the same 190 MB image. Roughly how much disk do the image layers use?', o: ['380 MB', '190 MB', '0 MB', '95 MB'], a: 1, why: 'Image layers are read-only and shared. Each container adds only a small writable layer.' }
  ] });

/* ===== Chapter 2 ===== */
add({ id: '2-1', ch: 2, title: 'Step inside', xp: 150, badge: 'diver', codex: ['namespaces'],
  brief: 'Container "web" is running. Open a shell inside it and look around: what can a process in there see?',
  learn: '<p><code>docker exec</code> starts an <i>extra</i> process inside a running container by joining its existing <b>namespaces</b>. Namespaces are the kernel feature that fakes isolation: the process gets its own process list, hostname, network and filesystem view.</p><p>We use <code>nginx:alpine</code> here because the Debian-based nginx image does not even include <code>ps</code>. Minimal images often lack tools.</p>',
  setup: function (w) { w.preload(['nginx:alpine']); w.silent('docker run -d --name web nginx:alpine'); },
  goals: [
    { text: 'Open an interactive shell in "web"', hint: 'docker exec -it web sh', check: function (ev) { return E(ev, 'exec', function (e) { return e.ok && e.it; }); } },
    { text: 'List processes inside: who is PID 1?', hint: 'ps', check: function (ev) { return E(ev, 'ps-inside'); } },
    { text: 'Print the hostname', hint: 'hostname', check: function (ev) { return E(ev, 'shell-cmd', function (e) { return /^hostname/.test(e.line); }); } },
    { text: 'Leave the shell', hint: 'exit', check: function (ev) { return E(ev, 'shell-exit', function (e) { return !e.main; }); } }
  ],
  wrap: '<p>Inside, nginx was <b>PID 1</b> and you saw only a handful of processes: that is the <b>PID namespace</b>. The hostname was the container ID: the <b>UTS namespace</b>. When you exited, the container kept running because you only ended the extra shell, not PID 1.</p>' });

add({ id: '2-2', ch: 2, title: 'The disappearing file', xp: 160, codex: ['cow'],
  brief: 'A colleague saved notes inside a container and then deleted the container. Reproduce the accident and see exactly where the file lived.',
  learn: '<p>A container\'s filesystem is the image\'s read-only layers plus one thin <b>writable layer</b> on top (overlay2\'s <i>UpperDir</i>). Writes go there. If a file came from the image, it is first copied up: <b>copy-on-write</b>.</p><p>The writable layer belongs to that one container and is deleted with it.</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'Start an interactive alpine container named "temp"', hint: 'docker run -it --name temp alpine sh', check: function (ev) { return E(ev, 'run', function (e) { return e.name === 'temp'; }); } },
    { text: 'Inside it, write /notes.txt, then exit', hint: 'echo "remember the milk" > /notes.txt\nexit', check: function (ev, w, m) { if (E(ev, 'write', function (e) { return e.where === 'upper' && w.bornIds[e.cid] === 'temp'; })) m.wrote = true; return m.wrote && E(ev, 'shell-exit'); } },
    { text: 'Show what changed in its writable layer', hint: 'docker diff temp', check: function (ev) { return E(ev, 'diff', function (e) { return e.n > 0; }); } },
    { text: 'Remove "temp", then look for /notes.txt in a brand-new container', hint: 'docker rm temp\ndocker run --rm alpine cat /notes.txt', check: function (ev, w, m) { if (E(ev, 'rm', function (e) { return e.name === 'temp'; })) m.gone = true; return m.gone && E(ev, 'read-fail', function (e) { return e.path === '/notes.txt'; }); } }
  ],
  wrap: '<p><code>docker diff</code> showed <code>A /notes.txt</code>: added in the writable layer. <code>docker rm</code> threw that layer away, and a new container starts from the pristine image again. <b>Rule:</b> never keep data you care about in a container\'s writable layer.</p>' });

add({ id: '2-3', ch: 2, title: 'Data that survives', xp: 160, badge: 'keeper', codex: ['storage'],
  brief: 'Fix the accident: give the notes a home that outlives any container.',
  learn: '<p>A <b>named volume</b> is storage managed by Docker under <code>/var/lib/docker/volumes/NAME/_data</code>. Mount it into a container with <code>-v NAME:/path</code>. Writes to that path skip the writable layer and land in the volume.</p><p>Volumes exist independently: delete every container and the data is still there.</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'Create a volume called "notes"', hint: 'docker volume create notes', check: function (ev) { return E(ev, 'vol-create', function (e) { return e.name === 'notes'; }); } },
    { text: 'Write a file into it from a throwaway container', hint: 'docker run --rm -v notes:/data alpine sh -c "echo saved > /data/hello.txt"', check: function (ev) { return E(ev, 'write', function (e) { return e.where === 'volume' && e.vol === 'notes'; }); } },
    { text: 'Read it back from a DIFFERENT new container', hint: 'docker run --rm -v notes:/data alpine cat /data/hello.txt', check: function (ev) { return E(ev, 'read', function (e) { return /^\/data\//.test(e.path); }); } },
    { text: 'List the volumes on this host', hint: 'docker volume ls', check: function (ev) { return E(ev, 'vol-ls') || E(ev, 'vol-inspect'); } }
  ],
  wrap: '<p>Both containers were deleted (<code>--rm</code>), yet the file survived because it lived in the volume. This is how databases run in Docker: <code>-v pgdata:/var/lib/postgresql/data</code>.</p>' });

add({ id: '2-4', ch: 2, title: 'Live edits with bind mounts', xp: 170, codex: ['storage'],
  brief: 'A web designer wants to edit HTML on their laptop and see it served instantly, without rebuilding anything.',
  learn: '<p>A <b>bind mount</b> maps a folder from your machine straight into the container: <code>-v ./site:/usr/share/nginx/html</code>. Both sides see the same files at the same time. Perfect for development.</p><p>Your project folder already has <code>site/index.html</code> (see the Files tab).</p>',
  setup: function (w) { w.preload(['nginx']); w.setFiles({ 'site/index.html': '<h1>My first site</h1>\n<p>Served from a bind mount.</p>\n' }); },

    { text: 'Serve ./site with nginx on host port 8080', hint: 'docker run -d --name site -p 8080:80 -v ./site:/usr/share/nginx/html nginx', check: function (ev, w) { return running(w, function (c) { return c.cfg.mounts.some(function (m) { return m.type === 'bind' && m.target === '/usr/share/nginx/html'; }) && c.cfg.ports.some(function (p) { return p.host === 8080; }); }).length > 0; } },
    { text: 'Fetch the page: is it yours?', hint: 'curl localhost:8080', check: function (ev) { return E(ev, 'curl', function (e) { return /My first site/.test(e.body || ''); }); } },
    { text: 'Edit site/index.html on the host (Files tab, or sim edit)', hint: 'sim edit site/index.html', check: function (ev) { return E(ev, 'host-file', function (e) { return e.files.some(function (f) { return /site\/index\.html/.test(f); }); }); } },
    { text: 'Fetch again and see the change with no restart', hint: 'curl localhost:8080', check: function (ev, w) { var f = w.host.files['site/index.html']; return E(ev, 'curl', function (e) { return e.ok && f && e.body === f.content && !/^<h1>My first site<\/h1>\n<p>Served from a bind mount.<\/p>\n$/.test(e.body); }); } }
  ],
  wrap: '<p>No rebuild, no restart: nginx reads straight from your folder. <b>Volume vs bind mount:</b> use volumes for data Docker should manage (databases), bind mounts for files <i>you</i> edit (code, config). In production, bake code into the image instead.</p>' });

add({ id: '2-5', ch: 2, title: 'Read the logs', xp: 170, codex: ['logs', 'env'],
  brief: 'A database container keeps dying seconds after it starts. Find out why and fix it.',
  learn: '<p>Whatever a container writes to <b>stdout/stderr</b> is captured by Docker. <code>docker logs NAME</code> shows it, even after the container has exited. This is always your first debugging step.</p><p>Configuration goes in through <b>environment variables</b> with <code>-e KEY=value</code>.</p>',
  setup: function (w) { w.preload(['postgres:16']); },
  goals: [
    { text: 'Start postgres:16 in the background as "db"', hint: 'docker run -d --name db postgres:16', check: function (ev) { return E(ev, 'run', function (e) { return e.name === 'db'; }); } },
    { text: 'Notice it is not running any more', hint: 'docker ps -a', check: function (ev) { return E(ev, 'ps', function (e) { return e.all; }); } },
    { text: 'Read its logs to find the reason', hint: 'docker logs db', check: function (ev) { return E(ev, 'logs', function (e) { return e.exitCode === 1; }); } },
    { text: 'Remove it and start it again WITH a password so it stays up', hint: 'docker rm db\ndocker run -d --name db -e POSTGRES_PASSWORD=secret postgres:16', check: function (ev, w) { var c = w.findC('db'); return !!c && c.state === 'running' && c.an.beh === 'postgres'; } }
  ],
  wrap: '<p>The image\'s entrypoint script refused to initialise without <code>POSTGRES_PASSWORD</code> and exited with code 1. Bonus detail: look at the Volumes row. The postgres image declares <code>VOLUME /var/lib/postgresql/data</code>, so Docker silently created an <b>anonymous volume</b> (a long hash) for each attempt. They pile up unless you use named volumes or <code>docker rm -v</code>.</p>' });

add({ id: '2-q', ch: 2, title: 'Checkpoint: Inside the Box', type: 'quiz', xp: 0,
  questions: [
    { q: 'Which kernel feature makes a container see its own process list starting at PID 1?', o: ['cgroups', 'PID namespace', 'seccomp', 'overlay2'], a: 1, why: 'Namespaces control what a process can see. cgroups control what it can use.' },
    { q: 'You write a file inside a container (no volumes), then docker rm it. The file is…', o: ['Saved in the image', 'Gone with the writable layer', 'Moved to a volume', 'Still in /tmp on the host'], a: 1, why: 'Writes go to the container\'s writable layer, deleted on rm.' },
    { q: 'docker stop then docker start on the same container. Files written earlier are…', o: ['Gone', 'Still there', 'Moved to the image', 'Only there if you used -it'], a: 1, why: 'The writable layer belongs to the container and survives stop/start; only rm deletes it.' },
    { q: 'Best choice for a production database\'s data directory?', o: ['Container writable layer', 'Named volume', 'tmpfs', 'COPY it into the image'], a: 1, why: 'Named volumes are managed by Docker, survive containers and are easy to back up.' },
    { q: 'A container exits right after starting. Your first command should be…', o: ['docker rmi', 'docker logs NAME', 'docker system prune', 'docker pull again'], a: 1, why: 'Logs keep stdout/stderr even after exit and usually say why.' }
  ] });

/* ===== Chapter 3 ===== */
add({ id: '3-1', ch: 3, title: 'Your first build', xp: 170, badge: 'wright', codex: ['dockerfile', 'context'], files: ['Dockerfile', 'app.py', 'requirements.txt'],
  brief: 'The dev team has a Flask app in ~/quest. Turn it into an image. Open the Files tab to read the Dockerfile first.',
  learn: '<p>A <b>Dockerfile</b> is a recipe. Each line is an instruction; <code>FROM</code>, <code>RUN</code>, <code>COPY</code>, <code>ADD</code> and <code>WORKDIR</code> produce layers, the rest (<code>CMD</code>, <code>ENV</code>, <code>EXPOSE</code>, <code>USER</code>) only set metadata.</p><p><code>docker build -t NAME:TAG .</code> sends the folder <code>.</code> (the <b>build context</b>) to BuildKit, runs each step and stacks the results. Watch the Build Lab panel.</p>',
  setup: function (w) { projPython(w); w.preload(['python:3.12-slim']); },
  goals: [
    { text: 'Build the image as myapp:1.0', hint: 'docker build -t myapp:1.0 .', check: function (ev) { return E(ev, 'build', function (e) { return e.tags.indexOf('myapp:1.0') >= 0; }); } },
    { text: 'See your new image next to its base', hint: 'docker images', check: function (ev) { return E(ev, 'images'); } },
    { text: 'Inspect its layers, newest first', hint: 'docker history myapp:1.0', check: function (ev) { return E(ev, 'history'); } }
  ],
  wrap: '<p>Your image = the 125 MB python base layers + your layers. But look at the build output: the context was <b>~250 MB</b> because <code>.git</code> and <code>venv</code> were uploaded, and <b>.env with real passwords</b> was copied into the image. Next mission fixes that.</p>' });

add({ id: '3-2', ch: 3, title: 'Pack light: .dockerignore', xp: 170, codex: ['context'], files: ['.dockerignore', 'Dockerfile'],
  brief: 'Security noticed .env inside the image and the network team is asking why every build uploads 250 MB. Fix both with one small file.',
  learn: '<p><code>.dockerignore</code> works like <code>.gitignore</code> for the build context. Anything listed is never sent to the builder, so it cannot be copied into the image, cannot break the cache and does not slow builds down.</p><p>Create it in the Files tab (type the name and press Create), or from the terminal: <code>printf \'.git\\nvenv/\\n.env\\n\' &gt; .dockerignore</code></p>',
  setup: function (w) { projPython(w); w.preload(['python:3.12-slim']); },
  goals: [
    { text: 'Create a .dockerignore excluding .git, venv/ and .env', file: { name: '.dockerignore', content: IGNORE }, check: function (ev, w) { var c = w.contextFiles(); return !!w.host.files['.dockerignore'] && c.size < 5e6 && !c.files['.env']; } },
    { text: 'Rebuild myapp:1.0 with a context under 5 MB and no secrets inside', hint: 'docker build -t myapp:1.0 .', check: function (ev) { return E(ev, 'build', function (e) { return e.contextSize < 5e6 && !e.copiedSecret; }); } }
  ],
  wrap: '<p>Context went from ~250 MB to under 1 kB. Every build is faster, and secrets can no longer leak through <code>COPY . .</code>. Always start a project with a .dockerignore.</p>' });

add({ id: '3-3', ch: 3, title: 'The cache cascade', xp: 200, badge: 'cache', codex: ['cache'], files: ['Dockerfile', 'app.py'],
  brief: 'Developers complain: changing one line of Python makes every build reinstall all dependencies (38 s each time). Find out why and fix it.',
  learn: '<p>BuildKit reuses a cached layer when the <b>parent layer</b>, the <b>instruction text</b> and (for COPY/ADD) the <b>checksum of the copied files</b> are unchanged. The first step that misses invalidates <i>every step after it</i>.</p><p><code>COPY . .</code> copies <code>app.py</code>, so editing app.py changes that step, and <code>RUN pip install</code> after it must rerun.</p>',
  setup: function (w) { projPython(w, { ignore: true }); w.preload(['python:3.12-slim']); w.silent('docker build -t myapp:1.0 .'); },
  goals: [
    { text: 'Edit app.py and rebuild: watch pip install run again', hint: 'sim edit app.py\ndocker build -t myapp:1.0 .', check: function (ev, w, m) { if (E(ev, 'host-file', function (e) { return e.files.indexOf('app.py') >= 0; })) m.ed1 = true; return m.ed1 && E(ev, 'build', function (e) { return e.steps.some(function (s) { return s.op === 'RUN' && /pip install/.test(s.text) && !s.cached; }); }); } },
    { text: 'Reorder the Dockerfile: copy requirements.txt and install BEFORE copying the code', file: { name: 'Dockerfile', content: DF_GOOD }, check: function (ev, w) { var d = (w.host.files.Dockerfile || {}).content || ''; var a = d.indexOf('COPY requirements.txt'), b = d.indexOf('pip install'), c = d.indexOf('COPY . .'); return a >= 0 && b > a && c > b; } },
    { text: 'Build the new Dockerfile once to warm the cache', hint: 'docker build -t myapp:1.0 .', check: function (ev, w) { var d = (w.host.files.Dockerfile || {}).content || ''; return d.indexOf('COPY requirements.txt') >= 0 && E(ev, 'build'); } },
    { text: 'Edit app.py again and rebuild: pip install must be CACHED', hint: 'sim edit app.py\ndocker build -t myapp:1.0 .', check: function (ev) { return E(ev, 'build', function (e) { var pip = e.steps.filter(function (s) { return /pip install/.test(s.text); })[0]; var cp = e.steps.filter(function (s) { return /COPY \. \./.test(s.text); })[0]; return pip && pip.cached && cp && !cp.cached; }); } }
  ],
  wrap: '<p>Rebuild time went from ~40 s to ~0.1 s. <b>The rule:</b> order instructions from least-often-changed to most-often-changed. Dependencies first, source code last. This one habit saves teams hours a week.</p>' });

add({ id: '3-4', ch: 3, title: 'CMD vs ENTRYPOINT', xp: 160, codex: ['cmdentry'],
  brief: 'The tools team ships an image called quest/greeter. Figure out how its start command is assembled.',
  learn: '<p>The command a container runs = <b>ENTRYPOINT</b> + <b>CMD</b>.</p><ul><li>Arguments after the image name in <code>docker run</code> <i>replace CMD</i>.</li><li><code>--entrypoint</code> replaces ENTRYPOINT (and drops CMD).</li></ul><p>quest/greeter has <code>ENTRYPOINT ["echo","Hello"]</code> and <code>CMD ["world"]</code>.</p>',
  setup: function (w) { w.preload(['quest/greeter']); },
  goals: [
    { text: 'Run it with no arguments', hint: 'docker run --rm quest/greeter', check: function (ev) { return E(ev, 'run', function (e) { return /greeter/.test(e.imageName) && !e.cmd.length && !e.opts.entrypoint; }); } },
    { text: 'Run it with one argument (it replaces CMD)', hint: 'docker run --rm quest/greeter Docker', check: function (ev) { return E(ev, 'run', function (e) { return /greeter/.test(e.imageName) && e.cmd.length > 0 && !e.opts.entrypoint; }); } },
    { text: 'Replace the entrypoint entirely', hint: 'docker run --rm --entrypoint date quest/greeter', check: function (ev) { return E(ev, 'run', function (e) { return /greeter/.test(e.imageName) && !!e.opts.entrypoint; }); } },
    { text: 'Inspect the image to see Entrypoint and Cmd', hint: 'docker image inspect quest/greeter', check: function (ev) { return E(ev, 'inspect', function (e) { return e.kind === 'image'; }); } }
  ],
  wrap: '<p>Use <b>CMD</b> for a sensible default that users may replace. Use <b>ENTRYPOINT</b> when the image <i>is</i> a tool and arguments should be passed to it. Always write them in <b>exec form</b> (<code>["prog","arg"]</code>), not shell form, so signals reach your app. Chapter 5 shows why.</p>' });

add({ id: '3-5', ch: 3, title: 'The layer that would not shrink', xp: 200, badge: 'surgeon', codex: ['layers', 'cache'], files: ['Dockerfile.tools', 'Dockerfile.slim'],
  brief: 'Dockerfile.tools downloads a 250 MB archive, unpacks it, then deletes it. Yet the image is huge. Prove why, then cut at least 200 MB.',
  learn: '<p>Each <code>RUN</code> commits a layer. A layer can only <i>add</i> files or <i>hide</i> them with a whiteout marker. Deleting a file in a later RUN does not remove the bytes from the earlier layer.</p><p>Fix: download, use and delete <b>in the same RUN</b>, joined with <code>&amp;&amp;</code>, and clean package lists in that same step.</p>',
  setup: function (w) { w.preload(['ubuntu:24.04']); w.setFiles({ 'Dockerfile.tools': 'FROM ubuntu:24.04\nRUN apt-get update\nRUN apt-get install -y curl\nRUN curl -fsSL -o /tmp/tool.tar.gz https://example.com/tool.tar.gz\nRUN tar -xzf /tmp/tool.tar.gz -C /opt\nRUN rm /tmp/tool.tar.gz\nRUN rm -rf /var/lib/apt/lists/*\n' }); },
  goals: [
    { text: 'Build Dockerfile.tools as tools:fat', hint: 'docker build -f Dockerfile.tools -t tools:fat .', check: function (ev) { return E(ev, 'build', function (e) { return e.tags.indexOf('tools:fat') >= 0; }); } },
    { text: 'Find the fat layer and the 0 B "rm" layer', hint: 'docker history tools:fat', check: function (ev, w) { return E(ev, 'history', function (e) { return /tools:fat/.test(e.name); }); } },
    { text: 'Write Dockerfile.slim doing everything in ONE RUN', file: { name: 'Dockerfile.slim', content: 'FROM ubuntu:24.04\nRUN apt-get update \\\n && apt-get install -y --no-install-recommends curl \\\n && curl -fsSL -o /tmp/tool.tar.gz https://example.com/tool.tar.gz \\\n && tar -xzf /tmp/tool.tar.gz -C /opt \\\n && rm /tmp/tool.tar.gz \\\n && rm -rf /var/lib/apt/lists/*\n' }, check: function (ev, w) { return !!w.host.files['Dockerfile.slim']; } },
    { text: 'Build it as tools:slim, at least 200 MB smaller', hint: 'docker build -f Dockerfile.slim -t tools:slim .\ndocker images tools', check: function (ev, w) { var a = w.resolveImage('tools:fat'), b = w.resolveImage('tools:slim'); return !!a && !!b && w.imageSize(a) - w.imageSize(b) >= 200e6; } }
  ],
  wrap: '<p>Same result, ~300 MB lighter. The size of an image is the sum of its layers, and nothing in a later layer can make an earlier one smaller. Two more tools for the same job: <b>multi-stage builds</b> (Chapter 7) and <code>COPY --chown</code> instead of a separate <code>RUN chown -R</code>, which duplicates every file.</p>' });

add({ id: '3-6', ch: 3, title: 'Ship it', xp: 170, codex: ['registry'],
  brief: 'myapp:1.0 is ready. Publish it to your Docker Hub account "you" so the servers can pull it.',
  learn: '<p>An image name encodes where it lives: <code>[registry/]namespace/repo:tag</code>. <code>myapp:1.0</code> has no namespace, so it cannot be pushed anywhere. <b>Tag</b> it with your namespace (a tag is just another name for the same image ID), <b>log in</b>, then <b>push</b>.</p><p>Watch which layers actually upload.</p>',
  setup: function (w) { projPython(w, { good: true, ignore: true }); w.preload(['python:3.12-slim']); w.silent('docker build -t myapp:1.0 .'); },
  goals: [
    { text: 'Log in to Docker Hub', hint: 'docker login', check: function (ev) { return E(ev, 'login'); } },
    { text: 'Tag myapp:1.0 as you/myapp:1.0', hint: 'docker tag myapp:1.0 you/myapp:1.0', check: function (ev) { return E(ev, 'tag', function (e) { return e.dst === 'you/myapp:1.0'; }); } },
    { text: 'Push it', hint: 'docker push you/myapp:1.0', check: function (ev) { return E(ev, 'push', function (e) { return e.full === 'docker.io/you/myapp'; }); } }
  ],
  wrap: '<p>Only your own layers were uploaded. The python base layers said <b>"Mounted from library/python"</b>: the registry already had them, so it linked them for free. This is why shared base images make deployments fast. Never deploy <code>:latest</code>; tag versions or git SHAs.</p>' });

add({ id: '3-q', ch: 3, title: 'Checkpoint: Shipwright', type: 'quiz', xp: 0,
  questions: [
    { q: 'Which instruction does NOT create a filesystem layer?', o: ['RUN', 'COPY', 'CMD', 'ADD'], a: 2, why: 'CMD, ENV, EXPOSE, USER and LABEL only change image metadata.' },
    { q: 'Editing app.py causes RUN pip install to rerun. Most likely cause?', o: ['pip is slow', 'COPY . . comes before RUN pip install', 'Missing EXPOSE', 'The base image changed'], a: 1, why: 'The cache misses at COPY . . and every later step rebuilds. Copy requirements first.' },
    { q: 'RUN rm big.tar in a later layer reduces image size by…', o: ['The size of big.tar', 'Nothing', 'Half', 'It fails'], a: 1, why: 'Later layers can only hide files with a whiteout; bytes stay in the earlier layer.' },
    { q: 'docker run img --help with ENTRYPOINT ["tool"] and CMD ["run"] executes…', o: ['tool run --help', 'tool --help', '--help', 'run --help'], a: 1, why: 'Arguments replace CMD and are appended to ENTRYPOINT.' },
    { q: 'What does .dockerignore primarily control?', o: ['Which images get pruned', 'What is sent in the build context', 'Which ports are exposed', 'Which files git ignores'], a: 1, why: 'It filters the build context, so ignored files cannot be COPYed or bust the cache.' },
    { q: 'During push, a layer reports "Mounted from library/python". Meaning?', o: ['It failed', 'The registry already had it and linked it, no upload', 'It was compressed', 'It was mounted as a volume'], a: 1, why: 'Registries de-duplicate layers by digest across repositories.' }
  ] });

/* ===== Chapter 4 ===== */
add({ id: '4-1', ch: 4, title: 'No phone book on the default bridge', xp: 170, codex: ['networks'],
  brief: 'Two containers on the same host cannot find each other by name. Reproduce it and find the workaround.',
  learn: '<p>Without <code>--network</code>, containers join the built-in <b>bridge</b> network (docker0). They get IPs and can talk by IP, but the default bridge has <b>no embedded DNS</b>, so names do not resolve.</p><p>Use <code>docker exec CONTAINER ping -c 1 TARGET</code> to test.</p>',
  setup: function (w) { w.preload(['busybox']); },
  goals: [
    { text: 'Start two busybox containers "a" and "b" that keep running', hint: 'docker run -d --name a busybox sleep 3600\ndocker run -d --name b busybox sleep 3600', check: function (ev, w) { var a = w.findC('a'), b = w.findC('b'); return !!a && !!b && a.state === 'running' && b.state === 'running'; } },
    { text: 'From a, ping b BY NAME (it should fail)', hint: 'docker exec a ping -c 1 b', check: function (ev) { return E(ev, 'ping', function (e) { return !e.ok && e.byName; }); } },
    { text: 'Find b\'s IP address', hint: "docker inspect -f '{{.NetworkSettings.IPAddress}}' b", check: function (ev) { return E(ev, 'inspect', function (e) { return e.kind === 'container'; }); } },
    { text: 'From a, ping b BY IP (it works)', hint: function (w) { var b = w.findC('b'); return 'docker exec a ping -c 1 ' + (b && b.ips.bridge ? b.ips.bridge : '<ip of b>'); }, check: function (ev) { return E(ev, 'ping', function (e) { return e.ok && !e.byName && e.target; }); } }
  ],
  wrap: '<p>IPs change every time a container restarts, so hard-coding them is fragile. The default bridge exists for backwards compatibility. In real projects, always create your own network.</p>' });

add({ id: '4-2', ch: 4, title: 'Build your own network', xp: 180, badge: 'navigator', codex: ['networks'],
  brief: 'Create a private network for an API and its database so they can find each other by name.',
  learn: '<p>A <b>user-defined bridge</b> network (<code>docker network create NAME</code>) gives you: an embedded DNS server at 127.0.0.11 that resolves container names, isolation from other networks, and the ability to connect/disconnect containers live.</p>',
  setup: function (w) { w.preload(['busybox']); },
  goals: [
    { text: 'Create a network called appnet', hint: 'docker network create appnet', check: function (ev) { return E(ev, 'net-create', function (e) { return e.name === 'appnet'; }); } },
    { text: 'Run two containers "api" and "db" on appnet', hint: 'docker run -d --name api --network appnet busybox sleep 3600\ndocker run -d --name db --network appnet busybox sleep 3600', check: function (ev, w) { return running(w, function (c) { return !!c.ips.appnet; }).length >= 2; } },
    { text: 'From api, ping db by name', hint: 'docker exec api ping -c 1 db', check: function (ev) { return E(ev, 'ping', function (e) { return e.ok && e.byName && e.dns; }); } }
  ],
  wrap: '<p>Name resolution worked through Docker\'s embedded DNS. This is exactly what Compose does for you automatically: every project gets its own network, and services find each other by service name.</p>' });

add({ id: '4-3', ch: 4, title: 'Walls between networks', xp: 170, codex: ['networks'],
  brief: 'A "spy" container sits on a different network. Prove it cannot reach the database, then deliberately let it in.',
  learn: '<p>Containers on different networks cannot talk to each other at all: networks are separate L2 segments with firewall rules between them. That is a free security boundary. A container can join several networks with <code>docker network connect</code>.</p>',
  setup: function (w) { w.preload(['busybox']); w.silent('docker network create appnet'); w.silent('docker network create othernet'); w.silent('docker run -d --name api --network appnet busybox sleep 3600'); w.silent('docker run -d --name db --network appnet busybox sleep 3600'); w.silent('docker run -d --name spy --network othernet busybox sleep 3600'); },
  goals: [
    { text: 'From spy, try to ping db (it fails)', hint: 'docker exec spy ping -c 1 db', check: function (ev, w) { return E(ev, 'ping', function (e) { return !e.ok && w.bornIds[e.cid] === 'spy'; }); } },
    { text: 'Connect spy to appnet as well', hint: 'docker network connect appnet spy', check: function (ev) { return E(ev, 'net-connect', function (e) { return e.net === 'appnet'; }); } },
    { text: 'Ping db from spy again', hint: 'docker exec spy ping -c 1 db', check: function (ev, w) { return E(ev, 'ping', function (e) { return e.ok && w.bornIds[e.cid] === 'spy'; }); } },
    { text: 'Inspect appnet to see all members and IPs', hint: 'docker network inspect appnet', check: function (ev) { return E(ev, 'net-inspect'); } }
  ],
  wrap: '<p>A common production layout: a <b>frontend</b> network (proxy + web) and a <b>backend</b> network (web + database). Only the web app sits on both, so the proxy can never reach the database directly.</p>' });

add({ id: '4-4', ch: 4, title: 'Compose the stack', xp: 200, badge: 'conductor', codex: ['compose'], files: ['compose.yaml', 'Dockerfile', 'app.py'],
  brief: 'The hit-counter app needs Redis. Instead of five long docker commands, describe the whole stack in compose.yaml and start it with one.',
  learn: '<p><b>Docker Compose</b> reads <code>compose.yaml</code> and makes the same API calls you would. It creates a project network (services find each other by <i>service name</i>), named volumes, builds images, and starts services in dependency order. <code>depends_on: condition: service_healthy</code> waits for a health check.</p><p>Read compose.yaml in the Files tab.</p>',
  setup: function (w) { projPython(w, { good: true, ignore: true, compose: true }); w.preload(['python:3.12-slim', 'redis:7-alpine']); },
  goals: [
    { text: 'Start the whole stack in the background', hint: 'docker compose up -d', check: function (ev) { return E(ev, 'compose-up'); } },
    { text: 'Check the services', hint: 'docker compose ps', check: function (ev) { return E(ev, 'compose-ps'); } },
    { text: 'Hit the app twice: the counter goes up', hint: 'curl localhost:8000\ncurl localhost:8000', check: function (ev) { return E(ev, 'curl', function (e) { return e.count >= 2; }); } },
    { text: 'Read the logs of every service', hint: 'docker compose logs', check: function (ev) { return E(ev, 'compose-logs'); } }
  ],
  wrap: '<p>The web container reached Redis at the hostname <code>redis</code>, which is simply the service name on the <code>quest_default</code> network. Compose names things <code>project-service-N</code> and <code>project_volume</code>.</p>' });

add({ id: '4-5', ch: 4, title: 'Down, up, and where the data went', xp: 180, codex: ['compose', 'storage'],
  brief: 'Learn the one Compose flag that deletes production data, before it happens to you.',
  learn: '<p><code>docker compose down</code> stops and removes containers and networks, but <b>keeps named volumes</b>. <code>docker compose down -v</code> also deletes the volumes: the data is gone.</p>',
  setup: function (w) { projPython(w, { good: true, ignore: true, compose: true }); w.preload(['python:3.12-slim', 'redis:7-alpine']); w.silent('docker compose up -d'); w.silent('curl localhost:8000'); w.silent('curl localhost:8000'); },
  goals: [
    { text: 'Take the stack down (no flags)', hint: 'docker compose down', check: function (ev, w, m) { if (E(ev, 'compose-down', function (e) { return !e.volumes; })) { m.down = true; return true; } return false; } },
    { text: 'Bring it back and check the counter kept counting', hint: 'docker compose up -d\ncurl localhost:8000', check: function (ev, w, m) { return m.down && E(ev, 'curl', function (e) { return e.count >= 3; }); } },
    { text: 'Now take it down WITH volumes', hint: 'docker compose down -v', check: function (ev, w, m) { if (E(ev, 'compose-down', function (e) { return e.volumes; })) { m.wiped = true; return true; } return false; } },
    { text: 'Bring it up once more: the counter restarts at 1', hint: 'docker compose up -d\ncurl localhost:8000', check: function (ev, w, m) { return m.wiped && E(ev, 'curl', function (e) { return e.count === 1; }); } }
  ],
  wrap: '<p>Treat <code>-v</code> (and <code>docker volume rm</code>, <code>docker volume prune -a</code>) as "delete my database". Back volumes up with a throwaway container: <code>docker run --rm -v quest_redis-data:/data -v ./backup:/backup alpine tar czf /backup/redis.tgz -C /data .</code></p>' });

add({ id: '4-q', ch: 4, title: 'Checkpoint: Harbor Networks', type: 'quiz', xp: 0,
  questions: [
    { q: 'Two containers on the DEFAULT bridge network. Can "web" reach "db" by name?', o: ['Yes', 'No, the default bridge has no embedded DNS', 'Only with -p', 'Only with --privileged'], a: 1, why: 'Name resolution needs a user-defined network (or Compose).' },
    { q: 'In Compose, the web service connects to Redis using which hostname?', o: ['localhost', 'The service name, e.g. redis', '127.0.0.11', 'The host IP'], a: 1, why: 'Services resolve each other by service name on the project network.' },
    { q: 'From one container to another on the same network, which port do you use?', o: ['The published host port', 'The container port the app listens on', 'Port 80 always', 'Any port'], a: 1, why: 'Publishing (-p) is only for traffic from outside the host.' },
    { q: 'Inside a container, "localhost" refers to…', o: ['Your laptop', 'The container itself', 'The Docker daemon', 'The gateway'], a: 1, why: 'Each container has its own network namespace and loopback.' },
    { q: 'Which command deletes named volumes declared in compose.yaml?', o: ['docker compose down', 'docker compose stop', 'docker compose down -v', 'docker compose rm'], a: 2, why: '-v removes volumes. Plain down keeps them.' }
  ] });

/* ===== Chapter 5 ===== */
add({ id: '5-1', ch: 5, title: 'Self-healing containers', xp: 180, badge: 'healer', codex: ['restart'],
  brief: 'Your app crashes now and then, and the server is rebooted for patches every month. Make sure it always comes back.',
  learn: '<p><b>Restart policies</b> tell dockerd what to do when a container exits: <code>no</code> (default), <code>on-failure[:N]</code>, <code>unless-stopped</code>, <code>always</code>. They also apply when the daemon starts after a reboot.</p><p><code>sim crash</code> and <code>sim reboot</code> are simulator controls that make bad things happen on purpose.</p>',
  setup: function (w) { w.preload(['nginx']); },
  goals: [
    { text: 'Run nginx as "api" with --restart unless-stopped', hint: 'docker run -d --name api --restart unless-stopped nginx', check: function (ev, w) { var c = w.findC('api'); return !!c && /unless-stopped|always/.test(c.cfg.restart); } },
    { text: 'Run nginx as "fragile" with no restart policy', hint: 'docker run -d --name fragile nginx', check: function (ev, w) { var c = w.findC('fragile'); return !!c && c.cfg.restart === 'no'; } },
    { text: 'Crash both and compare', hint: 'sim crash api\nsim crash fragile', check: function (ev, w, m) { if (E(ev, 'restart', function (e) { return e.name === 'api'; })) m.a = true; if (E(ev, 'crash', function (e) { return e.name === 'fragile'; })) m.f = true; return m.a && m.f; } },
    { text: 'Reboot the host and see who returns', hint: 'sim reboot\ndocker ps -a', check: function (ev) { return E(ev, 'reboot', function (e) { return e.back.indexOf('api') >= 0; }); } }
  ],
  wrap: '<p>Use <code>unless-stopped</code> for long-running services on a single host: it restarts after crashes and reboots, but respects a deliberate <code>docker stop</code>. Restart policies do <i>not</i> fix a broken app that keeps running; that needs health checks plus an orchestrator.</p>' });

add({ id: '5-2', ch: 5, title: 'Meet the OOM killer', xp: 190, badge: 'oom', codex: ['cgroups', 'exitcodes'],
  brief: 'A memory leak in one container took down the whole server last week. Put a cap on memory and watch the kernel enforce it.',
  learn: '<p><b>cgroups</b> limit what a process can <i>use</i>: <code>-m 256m</code> writes 256 MiB into <code>memory.max</code>, <code>--cpus 0.5</code> sets <code>cpu.max</code>, <code>--pids-limit</code> caps process count. Without a limit, one container can eat the whole host.</p><p>When usage passes the limit, the kernel\'s <b>OOM killer</b> sends SIGKILL. Exit code 137.</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'Run "hog" (alpine sleep 3600) with a 256 MiB memory limit', hint: 'docker run -d --name hog -m 256m alpine sleep 3600', check: function (ev, w) { var c = w.findC('hog'); return !!c && c.cfg.mem > 0 && c.state === 'running'; } },
    { text: 'Check usage vs limit', hint: 'docker stats', check: function (ev) { return E(ev, 'stats'); } },
    { text: 'Make it allocate 400 MiB', hint: 'sim stress hog 400M', check: function (ev) { return E(ev, 'oom'); } },
    { text: 'Prove the kernel killed it', hint: "docker inspect -f '{{.State.OOMKilled}} {{.State.ExitCode}}' hog", check: function (ev) { return E(ev, 'inspect', function (e) { return e.kind === 'container'; }); } }
  ],
  wrap: '<p><code>OOMKilled: true</code> and exit code <b>137</b> (128 + signal 9). In the inspector\'s Namespaces tab you can see the cgroup meter. Note that <code>free</code> inside a container shows the <i>host\'s</i> RAM; the real limit lives in <code>/sys/fs/cgroup/memory.max</code>. Always set limits in production.</p>' });

add({ id: '5-3', ch: 5, title: 'Signals and PID 1', xp: 200, badge: 'signal', codex: ['signals', 'cmdentry'],
  brief: 'Deploys take 10 extra seconds and requests get cut off mid-flight. Two nearly identical images behave differently on docker stop. Find out why.',
  learn: '<p><code>docker stop</code> sends <b>SIGTERM</b> to PID 1, waits 10 s, then SIGKILL. Two traps:</p><ul><li><b>Shell form</b> <code>CMD node server.js</code> makes PID 1 <code>/bin/sh -c …</code>, which does not forward signals to your app.</li><li>The kernel ignores signals sent to PID 1 unless it has a handler.</li></ul><p><code>quest/shell-form</code> uses shell form; <code>quest/exec-form</code> uses <code>["node","server.js"]</code>.</p>',
  setup: function (w) { w.preload(['quest/shell-form', 'quest/exec-form']); },
  goals: [
    { text: 'Run and stop quest/shell-form', hint: 'docker run -d --name sf quest/shell-form\ndocker stop sf', check: function (ev, w) { return E(ev, 'stop', function (e) { return !e.graceful && imgIs(w, e.image, 'quest/shell-form'); }); } },
    { text: 'Run and stop quest/exec-form', hint: 'docker run -d --name ef quest/exec-form\ndocker stop ef', check: function (ev, w) { return E(ev, 'stop', function (e) { return e.graceful && imgIs(w, e.image, 'quest/exec-form'); }); } },
    { text: 'Fix shell-form WITHOUT rebuilding: add a tiny init', hint: 'docker run -d --init --name sfi quest/shell-form\ndocker stop sfi', check: function (ev, w) { return E(ev, 'stop', function (e) { return e.graceful && imgIs(w, e.image, 'quest/shell-form'); }); } }
  ],
  wrap: '<p>Shell form: 10 s wait, then SIGKILL (137). Exec form: clean exit 0 in under a second. <code>--init</code> runs <b>tini</b> as PID 1, which forwards signals and reaps zombie processes. Best practice: exec form + a SIGTERM handler in your code.</p>' });

add({ id: '5-4', ch: 5, title: 'Health checks', xp: 180, codex: ['health'],
  brief: 'An app can be "Up" and still be broken. Teach Docker to tell the difference.',
  learn: '<p>A <b>HEALTHCHECK</b> (in the Dockerfile, or <code>--health-cmd</code> at run time) is a command Docker runs periodically inside the container. Exit 0 = healthy. After <code>retries</code> consecutive failures the status becomes <b>unhealthy</b>.</p><p>Plain Docker only reports it. Compose uses it for <code>depends_on</code>, and Swarm/Kubernetes replace unhealthy containers.</p>',
  setup: function (w) { w.preload(['nginx']); },
  goals: [
    { text: 'Run nginx as "web" with a curl health check every 5s', hint: 'docker run -d --name web --health-cmd "curl -f http://localhost/ || exit 1" --health-interval 5s nginx', check: function (ev, w) { var c = w.findC('web'); return !!c && !!c.health; } },
    { text: 'See (healthy) in docker ps', hint: 'docker ps', check: function (ev, w) { var c = w.findC('web'); return E(ev, 'ps') && !!c && c.health && c.health.status === 'healthy'; } },
    { text: 'Break the app and wait for checks to fail', hint: 'sim break web\nsim wait 30', check: function (ev) { return E(ev, 'health', function (e) { return e.status === 'unhealthy'; }); } },
    { text: 'Confirm (unhealthy) in docker ps', hint: 'docker ps', check: function (ev, w) { var c = w.findC('web'); return E(ev, 'ps') && !!c && c.health && c.health.status === 'unhealthy'; } }
  ],
  wrap: '<p>The process never stopped, so <code>--restart</code> would never fire. Only a health check could see the 500s. Keep checks cheap, use an endpoint like <code>/health</code>, and remember the tool (curl/wget) must exist in the image.</p>' });

add({ id: '5-5', ch: 5, title: 'Housekeeping', xp: 170, codex: ['prune'],
  brief: 'The CI server is out of disk. Find what is eating space and reclaim at least 500 MB without touching anything in use.',
  learn: '<p>Docker never deletes anything on its own. Over time you collect stopped containers, <b>dangling images</b> (<code>&lt;none&gt;</code> left behind when a tag moves to a new build), unused images, anonymous volumes and build cache.</p><ul><li><code>docker system df</code> shows usage and what is reclaimable.</li><li><code>docker system prune</code> removes stopped containers, unused networks, dangling images and build cache. Add <code>-a</code> for all unused images.</li><li>Volumes are only pruned when you ask.</li></ul>',
  setup: function (w) { projPython(w, { good: true, ignore: true }); w.preload(['python:3.12-slim', 'node:22', 'alpine', 'postgres:16', 'redis:7-alpine']); w.silent('docker build -t myapp:1.0 .'); w.silent('sim edit requirements.txt'); w.silent('docker build -t myapp:1.0 .'); w.silent('sim edit requirements.txt'); w.silent('docker build -t myapp:1.0 .'); w.silent('docker run --name old1 alpine echo done'); w.silent('docker run --name old2 alpine echo done'); w.silent('docker run -d --name db postgres:16'); w.silent('docker run -d --name cache redis:7-alpine'); w.silent('docker rm -f db'); },
  goals: [
    { text: 'See what is using disk', hint: 'docker system df', check: function (ev) { return E(ev, 'df'); } },
    { text: 'Prune the safe stuff', hint: 'docker system prune', check: function (ev, w, m) { var f = 0; ev.forEach(function (e) { if (e.t === 'prune') f += e.freed || 0; }); m.freed = (m.freed || 0) + f; return E(ev, 'prune', function (e) { return e.what === 'system'; }); } },
    { text: 'Also remove all images not used by a container', hint: 'docker image prune -a', check: function (ev, w, m) { var f = 0; ev.forEach(function (e) { if (e.t === 'prune') f += e.freed || 0; }); m.freed2 = (m.freed2 || 0) + f; return E(ev, 'prune', function (e) { return e.all || e.what === 'images'; }) && (m.freed || 0) + (m.freed2 || 0) >= 5e8; } },
    { text: 'Clean up leftover anonymous volumes', hint: 'docker volume prune', check: function (ev) { return E(ev, 'prune', function (e) { return e.what === 'volumes'; }); } }
  ],
  wrap: '<p>The running Redis container and its image were untouched: prune only removes what nothing uses. In CI, schedule <code>docker system prune -af --filter "until=24h"</code>. On servers, also cap container logs in <code>/etc/docker/daemon.json</code>.</p>' });

add({ id: '5-q', ch: 5, title: 'Checkpoint: Production', type: 'quiz', xp: 0,
  questions: [
    { q: 'A container exits with code 137 and OOMKilled=true. What happened?', o: ['The app returned 137', 'The kernel killed it for exceeding its memory limit', 'docker stop was graceful', 'The image is broken'], a: 1, why: '137 = 128 + SIGKILL(9). OOMKilled confirms the cgroup limit.' },
    { q: 'docker stop takes exactly 10 seconds every time. Likely cause?', o: ['Slow disk', 'PID 1 ignores SIGTERM (shell form or no handler)', 'Too many layers', 'Network timeout'], a: 1, why: 'Docker waits the 10 s grace period, then SIGKILLs.' },
    { q: 'Which restart policy respects a manual docker stop even after a reboot?', o: ['always', 'unless-stopped', 'on-failure', 'no'], a: 1, why: 'always would bring it back on daemon restart; unless-stopped would not.' },
    { q: 'An app returns HTTP 500 but its process is alive. What detects it?', o: ['Restart policy', 'A HEALTHCHECK', 'docker logs', 'cgroups'], a: 1, why: 'Only a health check probes behaviour; restart policies react to exits.' },
    { q: 'A "dangling" image is…', o: ['A running image', 'An image with no tag, usually replaced by a newer build', 'A corrupted image', 'An image on another host'], a: 1, why: 'When a tag moves to a new build, the old image becomes <none>:<none>.' }
  ] });

/* ===== Chapter 6 ===== */
add({ id: '6-1', ch: 6, title: 'Who am I in there?', xp: 170, codex: ['security'],
  brief: 'An audit asks a simple question: what user do your containers run as?',
  learn: '<p>By default processes in a container run as <b>root</b> (UID 0). Namespaces limit what that root can see, but it is still root against the kernel. If an attacker escapes, they are root on the host.</p><p>Run as an unprivileged user with <code>--user UID:GID</code>, or set <code>USER</code> in the Dockerfile.</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'Ask a default alpine container who it is', hint: 'docker run --rm alpine whoami', check: function (ev) { return E(ev, 'run', function (e) { return e.argv.indexOf('whoami') >= 0 && !e.opts.u; }); } },
    { text: 'Run as UID 1000 and print the identity', hint: 'docker run --rm --user 1000:1000 alpine id', check: function (ev) { return E(ev, 'run', function (e) { return !!e.opts.u; }); } },
    { text: 'Show that UID 1000 cannot write to /', hint: 'docker run --rm --user 1000 alpine touch /hacked', check: function (ev) { return E(ev, 'write-fail', function (e) { return /Permission/.test(e.why); }); } }
  ],
  wrap: '<p>Non-root containers turn many exploits into "Permission denied". Our Chapter 3 Dockerfile already did this with <code>RUN useradd appuser</code> + <code>USER appuser</code>. Going further: <b>rootless Docker</b> runs the daemon itself without root, and <b>user namespaces</b> map container root to an unprivileged host UID.</p>' });

add({ id: '6-2', ch: 6, title: 'Drop capabilities', xp: 180, badge: 'least', codex: ['security'],
  brief: 'Root in a container still holds a default set of Linux capabilities. Remove them all, then add back only what is needed.',
  learn: '<p>Linux splits root\'s power into ~40 <b>capabilities</b>: CHOWN, NET_BIND_SERVICE, SYS_ADMIN… Docker grants a small default set and blocks dangerous syscalls with <b>seccomp</b>. <code>--cap-drop ALL</code> removes them; <code>--cap-add X</code> adds one back.</p><p>We test with <code>chown</code>, which needs CAP_CHOWN.</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'chown works with the default capabilities', hint: 'docker run --rm alpine chown nobody /tmp', check: function (ev) { return E(ev, 'cap-ok', function (e) { return !e.dropped.length; }); } },
    { text: 'chown fails after dropping ALL capabilities', hint: 'docker run --rm --cap-drop ALL alpine chown nobody /tmp', check: function (ev) { return E(ev, 'cap-denied'); } },
    { text: 'Drop ALL but add back only CHOWN', hint: 'docker run --rm --cap-drop ALL --cap-add CHOWN alpine chown nobody /tmp', check: function (ev) { return E(ev, 'cap-ok', function (e) { return e.dropped.indexOf('ALL') >= 0 && e.added.indexOf('CHOWN') >= 0; }); } }
  ],
  wrap: '<p>Least privilege: start from nothing and add what the app proves it needs. A web server binding port 80 as non-root needs only <code>NET_BIND_SERVICE</code>. The opposite, <code>--privileged</code>, grants everything and disables seccomp: treat it as root on the host.</p>' });

add({ id: '6-3', ch: 6, title: 'Lock the filesystem', xp: 170, codex: ['security', 'storage'],
  brief: 'If an attacker gets in, the first thing they do is download tools and modify files. Make the root filesystem read-only.',
  learn: '<p><code>--read-only</code> mounts the container\'s root filesystem read-only. The app can still write where you allow it: volumes, bind mounts, or <code>--tmpfs /tmp</code> (a RAM disk that disappears on stop).</p>',
  setup: function (w) { w.preload(['alpine']); },
  goals: [
    { text: 'Try to create a file on a read-only root', hint: 'docker run --rm --read-only alpine touch /x', check: function (ev) { return E(ev, 'write-fail', function (e) { return /Read-only/.test(e.why); }); } },
    { text: 'Allow scratch space with tmpfs and write there', hint: 'docker run --rm --read-only --tmpfs /tmp alpine touch /tmp/ok', check: function (ev) { return E(ev, 'write', function (e) { return e.where === 'tmpfs'; }); } }
  ],
  wrap: '<p>A hardened run combines all of it: <code>--read-only --tmpfs /tmp --user 1000 --cap-drop ALL --security-opt no-new-privileges -m 256m --pids-limit 100</code>.</p>' });

add({ id: '6-4', ch: 6, title: 'The keys to the kingdom', xp: 180, codex: ['security'],
  brief: 'A "monitoring" container someone found online asks you to mount /var/run/docker.sock. See what that really hands over.',
  learn: '<p>The Docker socket is the daemon\'s API, and dockerd runs as root. Any process that can write to the socket can start a <code>--privileged</code> container with the host disk mounted. <b>Mounting the socket = giving away root on the host.</b></p>',
  setup: function (w) { w.preload(['docker:cli', 'nginx']); w.silent('docker run -d --name payments nginx'); },
  goals: [
    { text: 'Start docker:cli interactively with the socket mounted', hint: 'docker run -it --rm -v /var/run/docker.sock:/var/run/docker.sock docker:cli sh', check: function (ev) { return E(ev, 'run', function (e) { return (e.opts.v || []).some(function (v) { return /docker\.sock/.test(v); }); }); } },
    { text: 'From inside, list the HOST\'s containers', hint: 'docker ps', check: function (ev) { return E(ev, 'socket-escape'); } },
    { text: 'Get out', hint: 'exit', check: function (ev) { return E(ev, 'shell-exit'); } }
  ],
  wrap: '<p>From inside a container you saw (and could have deleted) "payments". Only mount the socket into tools you fully trust (CI runners, Portainer, Traefik), prefer read-only proxies like docker-socket-proxy, or use rootless Docker.</p>' });

add({ id: '6-5', ch: 6, title: 'Secrets in the history', xp: 210, badge: 'secret', codex: ['secrets'], files: ['Dockerfile.leaky', 'Dockerfile.safe'],
  brief: 'A private package index needs a token at build time. The first attempt passes it as a build arg. Find out who can read it.',
  learn: '<p><code>ARG</code> values used by a <code>RUN</code> are recorded in the image <b>history</b> in plain text. <code>ENV</code> values are stored in the config. Anyone who can pull the image can read both.</p><p>BuildKit <b>secret mounts</b> (<code>RUN --mount=type=secret,id=X</code>) expose a file at <code>/run/secrets/X</code> only while that RUN executes. It is never written to a layer or the history.</p>',
  setup: function (w) { w.preload(['python:3.12-slim']); w.setFiles({ 'requirements.txt': PY_REQ, 'token.txt': 's3cr3t-pypi-token\n', '.dockerignore': 'token.txt\n', 'Dockerfile.leaky': 'FROM python:3.12-slim\nARG PIP_TOKEN\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --index-url https://__token__:${PIP_TOKEN}@pypi.example.com/simple -r requirements.txt\n' }); },
  goals: [
    { text: 'Build the leaky version with a build arg', hint: 'docker build -f Dockerfile.leaky --build-arg PIP_TOKEN=s3cr3t -t leaky:1 .', check: function (ev) { return E(ev, 'build', function (e) { return e.leak; }); } },
    { text: 'Read the token straight out of the history', hint: 'docker history --no-trunc leaky:1', check: function (ev) { return E(ev, 'history', function (e) { return e.leak; }); } },
    { text: 'Write Dockerfile.safe using a secret mount', file: { name: 'Dockerfile.safe', content: '# syntax=docker/dockerfile:1\nFROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN --mount=type=secret,id=piptoken \\\n    PIP_TOKEN=$(cat /run/secrets/piptoken) \\\n    pip install --no-cache-dir --index-url https://__token__:${PIP_TOKEN}@pypi.example.com/simple -r requirements.txt\n' }, check: function (ev, w) { return /type=secret/.test((w.host.files['Dockerfile.safe'] || {}).content || ''); } },
